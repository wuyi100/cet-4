<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1218">
<meta name="format-detection" content="telephone=no">
<title>CET-4 备考台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%237c6cf5'/%3E%3Ctext x='32' y='44' font-size='30' font-weight='700' font-family='system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' fill='%23ffffff'%3EC4%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%237c6cf5'/%3E%3Ctext x='32' y='44' font-size='30' font-weight='700' font-family='system-ui,-apple-system,Segoe UI,sans-serif' text-anchor='middle' fill='%23ffffff'%3EC4%3C/text%3E%3C/svg%3E">
<style>
/* ==========================================================================
   CET-4 备考台 · 样式（无外部依赖，无字体/CDN 请求）
   ========================================================================== */

:root {
  --bg: #0f1218;
  --bg2: #151a23;
  --card: #1a2029;
  --card2: #212a36;
  --line: #2a3342;
  --line2: #35414f;
  --text: #e9eef7;
  --dim: #97a3b6;
  --dim2: #6f7c90;
  --acc: #5b8cff;
  --ok: #34c98b;
  --warn: #f0a23b;
  --bad: #ef5f6b;
  --r: 16px;
  --r-sm: 10px;
  --shadow: 0 8px 24px rgba(0, 0, 0, .28);
  --mc: #5b8cff;
}

html[data-theme="light"] {
  --bg: #f2f5fa;
  --bg2: #ffffff;
  --card: #ffffff;
  --card2: #eef2f8;
  --line: #e0e6f0;
  --line2: #cfd8e6;
  --text: #17202e;
  --dim: #5a6a80;
  --dim2: #8593a6;
  --shadow: 0 6px 18px rgba(23, 32, 46, .08);
}

* { box-sizing: border-box; }

/* hidden 属性必须真的隐藏（.modal-wrap 的 display 会盖掉 UA 默认值） */
[hidden] { display: none !important; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
    "Microsoft YaHei", "Noto Sans SC", sans-serif;
  font-size: 15px;
  line-height: 1.55;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}

body {
  background:
    radial-gradient(1100px 500px at 15% -10%, rgba(91, 140, 255, .16), transparent 60%),
    radial-gradient(900px 460px at 95% 0%, rgba(199, 125, 255, .12), transparent 60%),
    var(--bg);
  min-height: 100vh;
}

a { color: var(--acc); text-decoration: none; }
b { font-weight: 650; }
h1, h2, h3 { margin: 0; font-weight: 650; line-height: 1.3; }

.app {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* ---------------- 顶栏 ---------------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 14px;
  padding-top: calc(10px + env(safe-area-inset-top));
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}

.brand { display: flex; align-items: center; gap: 9px; }
.logo {
  display: grid;
  place-items: center;
  width: 30px; height: 30px;
  border-radius: 9px;
  background: linear-gradient(135deg, #5b8cff, #c77dff);
  color: #fff;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .5px;
}
.brand-txt { font-weight: 650; font-size: 15px; letter-spacing: .2px; }
.top-link { font-size: 13px; color: var(--dim); }

/* ---------------- 底部 / 顶部标签 ---------------- */
.tabs {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 40;
  display: flex;
  padding-bottom: env(safe-area-inset-bottom);
  background: color-mix(in srgb, var(--bg2) 96%, transparent);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--line);
}

.tabs a {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 9px 0 8px;
  font-size: 11px;
  color: var(--dim2);
  transition: color .15s;
}
.tabs a .ti { font-size: 17px; line-height: 1; }
.tabs a.active { color: var(--acc); }
.tabs a.active .ti { transform: translateY(-1px); }

/* ---------------- 主区 ---------------- */
.main { flex: 1; }

.page {
  max-width: 720px;
  margin: 0 auto;
  padding: 14px 14px calc(84px + env(safe-area-inset-bottom));
}

.page-head {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.title { font-size: 22px; }
.sec-h {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin: 20px 2px 9px;
  font-size: 14px;
  color: var(--dim);
  letter-spacing: .3px;
}
.sec-h h2, .sec-h .h2 { font-size: 14px; color: var(--dim); font-weight: 600; }

/* ---------------- 卡片 / 文本 ---------------- */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 14px;
  box-shadow: 0 1px 0 rgba(255, 255, 255, .02) inset;
}
.card + .card { margin-top: 10px; }

.muted { color: var(--dim); font-size: 13px; }
.small { font-size: 12px; }
.center { text-align: center; }
.big { font-size: 20px; }
.ok { color: var(--ok); }
.bad { color: var(--bad); }
.link { font-size: 13px; }

.row { display: flex; align-items: center; }
.row.between { justify-content: space-between; }
.row.gap { gap: 10px; }
.row.gap8 { gap: 8px; }
.row.wrap { flex-wrap: wrap; }
.mt { margin-top: 12px; }
.mt8 { margin-top: 8px; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

/* ---------------- 按钮 ---------------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 14px;
  min-height: 40px;
  border: 1px solid var(--line2);
  border-radius: var(--r-sm);
  background: var(--card2);
  color: var(--text);
  font-size: 14px;
  font-family: inherit;
  white-space: nowrap;
  cursor: pointer;
  transition: transform .08s, filter .15s, background .15s;
  -webkit-appearance: none;
  appearance: none;
}
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary {
  background: linear-gradient(135deg, #5b8cff, #4a72e6);
  border-color: transparent;
  color: #fff;
  font-weight: 600;
}
.btn-ok { background: rgba(52, 201, 139, .16); border-color: rgba(52, 201, 139, .45); color: var(--ok); font-weight: 600; }
.btn-danger { background: rgba(239, 95, 107, .14); border-color: rgba(239, 95, 107, .45); color: var(--bad); font-weight: 600; }
.btn-ghost { background: transparent; }
.btn.sm, .btn-sm { min-height: 32px; padding: 6px 10px; font-size: 13px; }
.btn.wide { width: 100%; margin-top: 10px; }

.icon-btn {
  border: 0;
  background: transparent;
  color: var(--dim2);
  font-size: 18px;
  line-height: 1;
  padding: 6px 8px;
  cursor: pointer;
  border-radius: 8px;
  font-family: inherit;
}
.icon-btn:hover { background: var(--card2); color: var(--text); }
.icon-btn.txt { font-size: 13px; color: var(--dim); }
.icon-btn.txt.danger { color: var(--bad); }

/* ---------------- 徽标 / 标签 ---------------- */
.pill {
  display: inline-block;
  padding: 2px 9px;
  border-radius: 999px;
  font-size: 12px;
  background: var(--card2);
  color: var(--dim);
  border: 1px solid var(--line);
  white-space: nowrap;
}
.pill-m {
  background: color-mix(in srgb, var(--mc) 16%, transparent);
  border-color: color-mix(in srgb, var(--mc) 42%, transparent);
  color: var(--mc);
  font-weight: 600;
}
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11.5px;
  background: var(--card2);
  color: var(--dim);
  border: 1px solid var(--line);
  white-space: nowrap;
}
.badge-ok { color: var(--ok); background: rgba(52, 201, 139, .12); border-color: rgba(52, 201, 139, .35); }
.badge-bad { color: var(--bad); background: rgba(239, 95, 107, .12); border-color: rgba(239, 95, 107, .35); }
.badge-warn { color: var(--warn); background: rgba(240, 162, 59, .12); border-color: rgba(240, 162, 59, .38); }
.tag {
  font-size: 11px;
  color: var(--dim2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 1px 6px;
}
.tag-manual { color: var(--warn); border-color: rgba(240, 162, 59, .4); }

/* ---------------- 首页 ---------------- */
.statusbar {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 12px;
}
.sb-num { display: flex; flex-direction: column; gap: 1px; }
.sb-num b { font-size: 28px; letter-spacing: -1px; line-height: 1.05; }
.sb-num span, .sb-label { font-size: 11.5px; color: var(--dim); }
.sb-label { color: var(--dim2); letter-spacing: .3px; }
.sb-meta { font-size: 13px; min-width: 0; }
.sb-meta .muted { font-size: 12px; }
.sb-goal { text-align: right; }
.sb-goal b { font-size: 18px; }
.sb-goal .muted { font-size: 11px; }

.today-card {
  border-left: 4px solid var(--mc);
}
.today-card.ot { background: rgba(240, 162, 59, .10); border-color: rgba(240, 162, 59, .4); }
.task-txt { margin: 10px 0 8px; font-size: 15.5px; line-height: 1.6; }

.banner-warn {
  margin: 10px 0;
  padding: 10px 12px;
  border-radius: var(--r-sm);
  background: rgba(240, 162, 59, .12);
  border: 1px solid rgba(240, 162, 59, .4);
  color: var(--warn);
  font-size: 13px;
}

.memo-list { list-style: none; margin: 10px 0 0; padding: 0; }
.memo {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 0;
  border-bottom: 1px dashed var(--line);
}
.memo:last-child { border-bottom: 0; }
.memo-txt { flex: 1; font-size: 14px; word-break: break-word; }
.memo.done .memo-txt, .done-txt { color: var(--dim2); text-decoration: line-through; }
.memo-row { padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.memo-done { margin-top: 10px; }
.memo-done summary { font-size: 12px; color: var(--dim2); cursor: pointer; }

.cb {
  width: 20px; height: 20px;
  accent-color: var(--acc);
  flex: 0 0 auto;
  cursor: pointer;
}

.weekstrip {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  margin-top: 12px;
}
.wcell {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 6px 2px;
  border-radius: 10px;
  background: var(--card2);
  border: 1px solid var(--line);
  color: var(--text);
  font-size: 11px;
}
.wcell .wd { color: var(--dim2); font-size: 10px; }
.wcell .wdate { font-weight: 600; font-size: 13px; }
.wcell .wdot { width: 7px; height: 7px; border-radius: 50%; background: var(--line2); }
.wcell.st-done .wdot { background: var(--ok); }
.wcell.st-missed .wdot { background: var(--bad); }
.wcell.st-done { border-color: rgba(52, 201, 139, .35); }
.wcell.st-missed { border-color: rgba(239, 95, 107, .35); }
.wcell.is-today { outline: 2px solid var(--acc); outline-offset: -1px; }

.mgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.mcard {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 12px;
  border-radius: var(--r);
  background: var(--card);
  border: 1px solid var(--line);
  border-top: 3px solid var(--mc);
  color: var(--text);
  min-height: 92px;
}
.mcard:active { background: var(--card2); }
.mname { font-size: 12.5px; color: var(--dim); }
.mval { font-size: 19px; line-height: 1.3; }
.mcap { font-size: 11.5px; color: var(--dim2); margin-top: auto; }

.saves .row { padding: 3px 0; font-size: 13px; }

/* ---------------- 分段控件 ---------------- */
.seg {
  display: flex;
  gap: 4px;
  padding: 4px;
  background: var(--card2);
  border: 1px solid var(--line);
  border-radius: 12px;
  margin-bottom: 12px;
  overflow-x: auto;
}
.seg-item {
  flex: 1;
  text-align: center;
  padding: 8px 10px;
  border-radius: 9px;
  font-size: 13.5px;
  color: var(--dim);
  border: 0;
  background: transparent;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
}
.seg-item.active {
  background: var(--card);
  color: var(--text);
  font-weight: 600;
  box-shadow: var(--shadow);
}
.seg.small .seg-item { padding: 6px 8px; font-size: 13px; }

/* ---------------- 今日计划 ---------------- */
.day-list { display: flex; flex-direction: column; gap: 8px; }
.day-compact {
  display: grid;
  grid-template-columns: auto auto 1fr auto auto;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--card);
  border: 1px solid var(--line);
  border-left: 3px solid var(--mc);
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  text-align: left;
  cursor: pointer;
}
.day-compact.is-today { outline: 1px solid var(--acc); }
.day-compact.missed { background: rgba(239, 95, 107, .09); }
.day-compact.ot { background: rgba(240, 162, 59, .10); }
.dc-date { color: var(--dim); font-size: 12px; white-space: nowrap; }
.dc-task {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 13px;
}
.dc-min { color: var(--dim2); font-size: 11.5px; white-space: nowrap; }

.day { border-left: 4px solid var(--mc); }
.day.missed { background: rgba(239, 95, 107, .09); border-color: rgba(239, 95, 107, .4); }
.day.ot { background: rgba(240, 162, 59, .09); }
.day.is-today { box-shadow: 0 0 0 1px var(--acc) inset; }
.day-date { font-weight: 650; font-size: 14px; }
.day .foot { margin-top: 10px; font-size: 11.5px; }

.status-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 10px 0; }
.sbtn {
  padding: 9px 4px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--card2);
  color: var(--dim);
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
}
.sbtn.on { font-weight: 650; color: var(--text); border-color: var(--line2); }
.sbtn-ok.on { background: rgba(52, 201, 139, .18); color: var(--ok); border-color: rgba(52, 201, 139, .5); }
.sbtn-bad.on { background: rgba(239, 95, 107, .18); color: var(--bad); border-color: rgba(239, 95, 107, .5); }

/* ---------------- 表单 ---------------- */
.field { margin: 10px 0; }
.label {
  display: flex;
  align-items: baseline;
  gap: 6px;
  font-size: 12px;
  color: var(--dim);
  margin-bottom: 5px;
}
.req { color: var(--bad); }
.counter { margin-left: auto; font-size: 11px; color: var(--dim2); font-weight: 400; }

.input {
  width: 100%;
  padding: 10px 11px;
  min-height: 40px;
  border-radius: var(--r-sm);
  border: 1px solid var(--line2);
  background: var(--bg2);
  color: var(--text);
  font-size: 16px; /* 防 iOS 聚焦缩放 */
  font-family: inherit;
  line-height: 1.45;
  -webkit-appearance: none;
  appearance: none;
}
.input:focus { outline: 2px solid color-mix(in srgb, var(--acc) 55%, transparent); outline-offset: -1px; }
textarea.input { resize: vertical; min-height: 56px; }
select.input {
  background-image: linear-gradient(45deg, transparent 50%, var(--dim) 50%),
    linear-gradient(135deg, var(--dim) 50%, transparent 50%);
  background-position: calc(100% - 16px) 18px, calc(100% - 11px) 18px;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  padding-right: 30px;
}
.area-task { font-size: 15px; }

.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.check {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 10px;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: var(--bg2);
  font-size: 13.5px;
  cursor: pointer;
}

.form { border-left: 4px solid var(--mc); }
.form-host { margin: 10px 0; }
.form-grid { display: grid; grid-template-columns: 1fr; gap: 0 10px; }

.steps { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.step { display: flex; align-items: center; gap: 8px; }
.step .step-input { flex: 1; font-size: 14px; min-height: 36px; padding: 7px 10px; }
.step.done .step-input { color: var(--dim2); text-decoration: line-through; }

.empty-line { color: var(--dim2); font-size: 13px; padding: 8px 0; }
.empty { text-align: center; padding: 22px 14px; }
.empty p { margin: 6px 0; }
.empty .btn { margin-top: 8px; }

/* ---------------- 模块记录 ---------------- */
.rec-list { display: flex; flex-direction: column; gap: 8px; }
.rec { border-left: 3px solid var(--mc); padding: 12px; }
.rec-date { font-size: 12px; color: var(--dim); }
.rec-main { margin: 6px 0 2px; font-size: 14.5px; }
.rec .muted.small { font-size: 12px; word-break: break-word; }

/* ---------------- 统计 ---------------- */
.bar {
  height: 9px;
  border-radius: 999px;
  background: var(--card2);
  overflow: hidden;
  margin-top: 9px;
}
.bar.thin { height: 7px; margin-top: 0; flex: 1; }
.bar-fill {
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--acc), #7aa2ff);
  transition: width .3s;
}
.bar-fill.ok { background: linear-gradient(90deg, #34c98b, #6fe3b3); }

.bar-row {
  display: grid;
  grid-template-columns: 52px 1fr 66px;
  align-items: center;
  gap: 9px;
  padding: 5px 0;
  font-size: 12.5px;
}
.bar-row .bl { color: var(--dim); white-space: nowrap; }
.bar-row .bv { color: var(--text); text-align: right; font-size: 12px; }

.vbars {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  height: 150px;
  padding-top: 4px;
}
.vbar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; }
.vb-val { font-size: 10.5px; color: var(--dim); }
.vb-track { flex: 1; width: 100%; display: flex; align-items: flex-end; }
.vb-col {
  width: 100%;
  border-radius: 6px 6px 2px 2px;
  background: linear-gradient(180deg, #7aa2ff, #4a72e6);
  min-height: 6px;
}
.vb-lab { font-size: 10px; color: var(--dim2); white-space: nowrap; }

/* ---------------- 复盘 ---------------- */
.rv { border-left: 3px solid var(--line2); }
.rv-mod {
  margin-top: 12px;
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--card2);
  border-left: 3px solid var(--mc);
}
.rv-name { font-size: 14px; }
.rv-rate { font-size: 15px; font-weight: 650; }
.rate-box {
  min-height: 36px;
  display: flex;
  align-items: center;
  padding: 6px 10px;
  border-radius: var(--r-sm);
  background: var(--bg2);
  border: 1px dashed var(--line2);
}
.rv-mod .field { margin: 8px 0; }
.rv-mod .grid3 .field { margin: 6px 0; }

/* ---------------- 对话框 / 提示 ---------------- */
.modal-wrap {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: grid;
  place-items: center;
  padding: 20px;
  background: rgba(0, 0, 0, .55);
  backdrop-filter: blur(3px);
}
.modal {
  width: 100%;
  max-width: 380px;
  background: var(--card);
  border: 1px solid var(--line2);
  border-radius: var(--r);
  overflow: hidden;
  box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
}
.modal-h { padding: 14px 16px 4px; font-weight: 650; font-size: 15px; }
.modal-b { padding: 4px 16px 8px; font-size: 14px; color: var(--dim); }
.modal-b p { margin: 6px 0; }
.modal-f {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--line);
}

.toast-wrap {
  position: fixed;
  left: 0; right: 0;

<script>
/* src/core/ui.js */
/* CET-4 备考台 · 极简 DOM 工具、提示、对话框 */
window.CET4 = window.CET4 || {};

CET4.UI = (function () {
  function append(parent, kids) {
    for (var i = 0; i < kids.length; i++) {
      var k = kids[i];
      if (k === null || k === undefined || k === false || k === true) continue;
      if (Array.isArray(k)) { append(parent, k); continue; }
      if (typeof k === 'string' || typeof k === 'number') {
        parent.appendChild(document.createTextNode(String(k)));
      } else if (k.nodeType) {
        parent.appendChild(k);
      }
    }
  }

  function h(tag, props) {
    var e = document.createElement(tag);
    if (props) {
      for (var k in props) {
        if (!Object.prototype.hasOwnProperty.call(props, k)) continue;
        var v = props[k];
        if (v === null || v === undefined || v === false) continue;
        if (k === 'class') e.className = v;
        else if (k === 'text') e.textContent = v;
        else if (k === 'dataset') { for (var d in v) e.dataset[d] = v[d]; }
        else if (k === 'style' && typeof v === 'object') { for (var s in v) e.style[s] = v[s]; }
        else if (k.length > 2 && k.slice(0, 2) === 'on' && typeof v === 'function') {
          e.addEventListener(k.slice(2), v);
        } else if (v === true) e.setAttribute(k, '');
        else e.setAttribute(k, v);
      }
    }
    append(e, Array.prototype.slice.call(arguments, 2));
    return e;
  }

  function frag() {
    var f = document.createDocumentFragment();
    append(f, Array.prototype.slice.call(arguments));
    return f;
  }

  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

  function toast(msg, kind) {
    var wrap = document.getElementById('toasts');
    if (!wrap) return;
    var t = h('div', { class: 'toast' + (kind ? ' toast-' + kind : ''), text: msg });
    wrap.appendChild(t);
    setTimeout(function () { t.classList.add('out'); }, 2400);
    setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 2800);
  }

  /* 通用确认框，返回 Promise<boolean> */
  function ask(opts) {
    return new Promise(function (resolve) {
      var wrap = document.getElementById('modals');
      var body = opts.body;
      var typedOk = true;
      var input = null;

      if (opts.requireText) {
        input = h('input', {
          class: 'input', type: 'text', placeholder: '输入「' + opts.requireText + '」',
          oninput: function () { typedOk = input.value.trim() === opts.requireText; okBtn.disabled = !typedOk; }
        });
        typedOk = false;
      }

      var okBtn = h('button', {
        class: 'btn ' + (opts.danger ? 'btn-danger' : 'btn-primary'),
        text: opts.okText || '确定',
        disabled: !typedOk,
        onclick: function () { close(true); }
      });

      var card = h('div', { class: 'modal' },
        h('div', { class: 'modal-h', text: opts.title || '确认' }),
        h('div', { class: 'modal-b' },
          typeof body === 'string' ? h('p', { text: body }) : (body || null),
          input ? h('div', { class: 'field' }, input) : null
        ),
        h('div', { class: 'modal-f' },
          h('button', { class: 'btn btn-ghost', text: '取消', onclick: function () { close(false); } }),
          okBtn
        )
      );

      function close(v) {
        wrap.hidden = true;
        clear(wrap);
        document.removeEventListener('keydown', onKey);
        resolve(v);
      }
      function onKey(e) { if (e.key === 'Escape') close(false); }

      document.addEventListener('keydown', onKey);
      clear(wrap);
      wrap.appendChild(card);
      wrap.hidden = false;
      wrap.onclick = function (e) { if (e.target === wrap) close(false); };
      if (input) setTimeout(function () { input.focus(); }, 30);
    });
  }

  function fmtMinutes(n) {
    if (n === null || n === undefined || n === '' || isNaN(n)) return '—';
    var v = Math.round(+n);
    if (v < 60) return v + ' 分钟';
    var hh = Math.floor(v / 60), mm = v % 60;
    return hh + ' 小时' + (mm ? ' ' + mm + ' 分' : '');
  }

  function fmtClock(isoDate, isoTime) {
    if (!isoDate) return '';
    var parts = isoDate.split('-');
    return (+parts[1]) + '/' + (+parts[2]) + (isoTime ? ' ' + isoTime : '');
  }

  function fmtStamp(iso) {
    if (!iso) return '从未';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '从未';
    var p = function (n) { return n < 10 ? '0' + n : '' + n; };
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  /* 逗号/顿号/空格分隔 → 数组；空串 → [] */
  function parseTags(str) {
    if (!str) return [];
    return String(str).split(/[,，、;；\s]+/).map(function (s) { return s.trim(); })
      .filter(function (s) { return s.length > 0; });
  }

  function tagsToStr(arr) { return (arr || []).join('，'); }

  return {
    h: h, frag: frag, clear: clear, toast: toast, ask: ask,
    fmtMinutes: fmtMinutes, fmtClock: fmtClock, fmtStamp: fmtStamp,
    parseTags: parseTags, tagsToStr: tagsToStr
  };
})();

</script>
<script>
/* src/core/store.js */
/* CET-4 备考台 · 状态存储：单键 JSON、自动保存、.prev 快照、导入导出 */
window.CET4 = window.CET4 || {};

CET4.Store = (function () {
  var TAX = CET4.TAX;
  var KEY = 'cet4.state.v1';
  var PREV = 'cet4.state.v1.prev';
  var SAVE_DELAY = 300;

  var _s = null;
  var _lastSaved = null;
  var _failed = false;
  var _corrupt = false;
  var _timer = null;

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function build() {
    var days = {};
    CET4.PLAN.forEach(function (p) {
      days[p.date] = {
        module: p.module,
        task: p.task,
        plannedMinutes: p.plannedMinutes,
        status: 'unset',
        actualMinutes: null,
        blocker: '',
        adjustment: '',
        steps: [],
        updatedAt: null
      };
    });
    var seed = CET4.SEED_RECORD;
    if (seed && days[seed.date]) {
      days[seed.date].status = seed.status;
      days[seed.date].actualMinutes = seed.actualMinutes;
      days[seed.date].blocker = seed.blocker;
      days[seed.date].adjustment = seed.adjustment;
      days[seed.date].updatedAt = seed.date;
    }

    var reviews = TAX.reviewDates.map(function (d, i) {
      return {
        id: 'r' + (i + 1),
        reviewDate: d,
        weekIndex: i + 1,
        entries: TAX.reviewModules.map(function (m) {
          return {
            module: m, total: null, correct: null,
            totalOverride: null, correctOverride: null,
            wrongNos: '', errorType: '', nextAction: ''
          };
        }),
        weekBlocker: '',
        weekFocus: ''
      };
    });

    return {
      schemaVersion: 1,
      savedAt: null,
      settings: {
        theme: 'dark',
        examDate: TAX.exam.date,
        examTime: TAX.exam.time,
        targetScore: 425,
        lastExportAt: null
      },
      days: days,
      logs: { listening: [], reading: [], writing: [], translation: [], vocab: [], mock: [] },
      memos: [],
      _seq: 1,
      reviews: reviews
    };
  }

  function normalize(s) {
    if (!s || typeof s !== 'object') return s;
    s.settings = s.settings || {};
    if (!s.settings.theme) s.settings.theme = 'dark';
    if (s.settings.targetScore == null) s.settings.targetScore = 425;
    s.logs = s.logs || {};
    TAX.logModules.forEach(function (k) { if (!Array.isArray(s.logs[k])) s.logs[k] = []; });
    if (!Array.isArray(s.memos)) s.memos = [];
    if (!Array.isArray(s.reviews)) s.reviews = [];
    if (typeof s._seq !== 'number') s._seq = 1;
    var days = s.days || {};
    CET4.PLAN.forEach(function (p) {
      var d = days[p.date];
      if (!d) {
        days[p.date] = {
          module: p.module, task: p.task, plannedMinutes: p.plannedMinutes,
          status: 'unset', actualMinutes: null, blocker: '', adjustment: '',
          steps: [], updatedAt: null
        };
      } else {
        if (!d.status) d.status = 'unset';
        if (!Array.isArray(d.steps)) d.steps = [];
        if (d.blocker == null) d.blocker = '';
        if (d.adjustment == null) d.adjustment = '';
      }
    });
    s.days = days;
    /* 复盘组补齐（老数据/被删） */
    TAX.reviewDates.forEach(function (d, i) {
      if (!s.reviews.some(function (r) { return r.weekIndex === i + 1; })) {
        s.reviews.push({
          id: 'r' + (i + 1), reviewDate: d, weekIndex: i + 1,
          entries: TAX.reviewModules.map(function (m) {
            return {
              module: m, total: null, correct: null, totalOverride: null,
              correctOverride: null, wrongNos: '', errorType: '', nextAction: ''
            };
          }),
          weekBlocker: '', weekFocus: ''
        });
      }
    });
    s.reviews.sort(function (a, b) { return a.weekIndex - b.weekIndex; });
    return s;
  }

  function available() {
    try {
      var k = '__cet4_probe__';
      localStorage.setItem(k, '1');
      localStorage.removeItem(k);
      return true;
    } catch (e) { return false; }
  }

  function readRaw() {
    try { return localStorage.getItem(KEY); } catch (e) { return null; }
  }

  function persist() {
    if (_timer) { clearTimeout(_timer); _timer = null; }
    if (!available()) { _failed = true; return false; }
    try {
      var next = JSON.stringify(_s);
      if (next === _lastSaved) { _failed = false; return true; }
      if (_lastSaved) {
        try { localStorage.setItem(PREV, _lastSaved); } catch (e) { /* 快照失败不阻塞主写 */ }
      }
      localStorage.setItem(KEY, next);
      _lastSaved = next;
      _failed = false;

    } catch (e) {

      return false;

  function nextId(prefix) {

    return prefix + '_' + _s._seq + '_' + Math.random().toString(36).slice(2, 6);
  }

  function init() {
    var raw = readRaw();

      try {

        } else {
          _corrupt = true;
        }
      } catch (e) {
        _corrupt = true;
      }
    }
    if (!_s) _s = normalize(build());
    if (_corrupt) return _s;
    if (readRaw() === null) persist();
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') flush();
    });
    window.addEventListener('pagehide', flush);
    return _s;
  }

  function flush() { return persist(); }

  function update(fn) {
    if (!_s) return;
    fn(_s);
    _s.savedAt = new Date().toISOString();
    schedule();
  }

  function exportPayload() {
    return {
      app: 'cet4-study',
      schemaVersion: 1,
      exportedAt: new Date().toISOString(),
      state: _s
    };
  }

  function exportText() { return JSON.stringify(exportPayload(), null, 2); }

  function exportFilename() {
    var d = new Date();
    return 'CET4-backup-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) +
      '-' + pad(d.getHours()) + pad(d.getMinutes()) + '.json';
  }

  function importText(txt) {
    var obj;
    try { obj = JSON.parse(txt); } catch (e) { return { ok: false, error: '不是合法的 JSON 文件' }; }
    if (!obj || obj.app !== 'cet4-study') return { ok: false, error: '文件不对：不是本应用的备份' };
    if (obj.schemaVersion !== 1) return { ok: false, error: '版本不支持：需要 schemaVersion 1' };
    if (!obj.state || !obj.state.days) return { ok: false, error: '内容缺失：找不到打卡数据' };
    if (!Object.keys(obj.state.days).length) return { ok: false, error: '内容缺失：打卡数据为空' };
    var next = normalize(obj.state);
    var backup = _lastSaved;
    _s = next;
    _lastSaved = null;
    if (!persist()) {
      _s = normalize(JSON.parse(backup));
      _lastSaved = backup;
      return { ok: false, error: '写入失败：浏览器存储不可用' };
    }
    return { ok: true };
  }

  function restorePrev() {
    var raw = null;
    try { raw = localStorage.getItem(PREV); } catch (e) { raw = null; }
    if (!raw) return { ok: false, error: '没有可恢复的上一份备份' };
    var parsed;
    try { parsed = JSON.parse(raw); } catch (e) { return { ok: false, error: '上一份备份已损坏' }; }
    if (!parsed || !parsed.days) return { ok: false, error: '上一份备份内容缺失' };
    _s = normalize(parsed);
    _lastSaved = null;
    persist();
    return { ok: true };
  }

  function reset() {
    _s = normalize(build());
    _lastSaved = null;
    persist();
    return _s;
  }

  return {
    KEY: KEY, PREV: PREV,
    init: init, get: function () { return _s; },
    update: update, flush: flush, schedule: schedule,
    nextId: nextId,
    available: available, isFailed: function () { return _failed; },
    isCorrupt: function () { return _corrupt; },
    exportText: exportText, exportFilename: exportFilename, importText: importText,
    restorePrev: restorePrev, reset: reset,
    markExported: function () {
      _s.settings.lastExportAt = new Date().toISOString();
      persist();
    }
  };
})();

<script>
/* src/core/derive.js */
/* CET-4 备考台 · 派生计算（全部纯函数，tests/unit.html 覆盖） */
window.CET4 = window.CET4 || {};

CET4.D = (function () {
  var TAX = CET4.TAX;
  var _s = null;
  var _today = null;

  function setState(s) { _s = s; }
  function getState() { return _s; }
  function setToday(v) { _today = v; }
  function resetToday() { _today = null; }

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function fmtDate(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function todayISO() { return _today || fmtDate(new Date()); }
  function parseISO(s) {
    var p = String(s).split('-');
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }
  function addDays(iso, n) {
    var d = parseISO(iso);
    d.setDate(d.getDate() + n);
    return fmtDate(d);
  }
  function inRange(iso, r) { return iso >= r.start && iso <= r.end; }

  function weekIndexOf(iso) {
    for (var i = 0; i < TAX.weeks.length; i++) {
      if (inRange(iso, TAX.weeks[i])) return TAX.weeks[i].idx;
    }
    return null;
  }
  function weekRange(idx) { return TAX.weeks[idx - 1]; }
  function weekLabel(idx) {
    var w = TAX.weeks[idx - 1];
    return w ? w.label : '';
  }
  function currentWeek() {
    var idx = weekIndexOf(todayISO());
    if (idx) return idx;
    return todayISO() < TAX.weeks[0].start ? 1 : TAX.weeks.length;
  }
  function weekdayOf(iso) {
    return TAX.weekdays[parseISO(iso).getDay()];
  }

  /* 区间内“已到期”的日期（到今天为止，未来不计） */
  function dueDays(r) {
    var out = [];
    if (!r) return out;
    var t = todayISO();
    var end = r.end < t ? r.end : t;
    if (end < r.start) return out;
    for (var d = r.start; d <= end; d = addDays(d, 1)) out.push(d);
    return out;
  }

  function day(iso) { return _s && _s.days ? _s.days[iso] : null; }

  function completion(r) {
    var days = dueDays(r), done = 0;
    for (var i = 0; i < days.length; i++) {
      var d = day(days[i]);
      if (d && d.status === 'done') done++;
    }
    return { done: done, due: days.length, rate: days.length ? done / days.length : null };
  }

  function totalProgress() {
    var r = { start: TAX.weeks[0].start, end: TAX.weeks[TAX.weeks.length - 1].end };
    var c = completion(r);
    return { done: c.done, due: c.due, rate: c.rate, total: 48 };
  }

  function moduleMinutes(module, r) {
    var days = dueDays(r), sum = 0;
    for (var i = 0; i < days.length; i++) {
      var d = day(days[i]);
      if (d && d.module === module && d.status === 'done') sum += (+d.actualMinutes || 0);
    }
    return sum;
  }

  function logsOf(key) {
    var arr = (_s && _s.logs && _s.logs[key]) || [];
    return arr.slice().sort(function (a, b) {
      if (a.date === b.date) return (a.id || '') < (b.id || '') ? 1 : -1;
      return a.date < b.date ? 1 : -1;
    });
  }
  function logsInRange(key, r) {
    return logsOf(key).filter(function (x) { return inRange(x.date, r); });
  }

  /* 该周该模块日志里的题数与正确数合计（写作/翻译/听力无题数，返回 0） */
  function autoCounts(weekIdx, module) {
    var r = weekRange(weekIdx);
    if (!r) return { total: 0, correct: 0 };
    if (module === '阅读') {
      var t = 0, c = 0;
      logsInRange('reading', r).forEach(function (x) {
        t += (+x.total || 0);
        c += (+x.correct || 0);
      });
      return { total: t, correct: c };
    }
    return { total: 0, correct: 0 };
  }

  function reviewOf(weekIdx) {
    var rs = (_s && _s.reviews) || [];
    for (var i = 0; i < rs.length; i++) if (rs[i].weekIndex === weekIdx) return rs[i];
    return null;
  }

  function entryOf(weekIdx, module) {
    var rev = reviewOf(weekIdx);
    if (!rev) return null;
    for (var i = 0; i < rev.entries.length; i++) {
      if (rev.entries[i].module === module) return rev.entries[i];
    }
    return null;
  }

  function moduleAccuracy(weekIdx, module) {
    var e = entryOf(weekIdx, module);
    var auto = autoCounts(weekIdx, module);
    var hasT = e && e.totalOverride !== null && e.totalOverride !== undefined;
    var hasC = e && e.correctOverride !== null && e.correctOverride !== undefined;
    var total = hasT ? +e.totalOverride : auto.total;
    var correct = hasC ? +e.correctOverride : auto.correct;
    var manual = !!(hasT || hasC);
    return {
      total: total, correct: correct,
      rate: total > 0 ? correct / total : null,
      manual: manual
    };
  }

  function mockTrend() {
    return logsOf('mock')
      .filter(function (x) { return x.estimate !== null && x.estimate !== undefined && x.estimate !== ''; })
      .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; })
      .map(function (x) {
        return {
          date: x.date, score: +x.estimate,
          listening: +x.listeningCorrect || 0, reading: +x.readingCorrect || 0
        };
      });
  }

  function errorDist(scope) {
    var map = {}, order = [];
    var rs = (_s && _s.reviews) || [];
    rs.forEach(function (rev) {
      rev.entries.forEach(function (e) {
        if (!e.errorType) return;
        if (scope && scope !== 'all' && e.module !== scope) return;
        if (!map[e.errorType]) { map[e.errorType] = 0; order.push(e.errorType); }
        map[e.errorType]++;
      });
    });
    return order.map(function (k) { return { type: k, count: map[k] }; });
  }

  function listProgress() {
    var seen = {};
    logsOf('vocab').forEach(function (x) { seen[x.list] = true; });
    var n = 0;
    for (var i = 1; i <= 6; i++) if (seen[i]) n++;
    return { done: n, total: 6 };
  }

  function countdown() {
    var diff = Math.round((parseISO(TAX.exam.date) - parseISO(todayISO())) / 86400000);
    if (diff > 0) return { days: diff, phase: 'before' };
    if (diff === 0) return { days: 0, phase: 'exam' };
    return { days: -diff, phase: 'after' };
  }

  function isOvertime(d) {
    return !!(d && +d.actualMinutes > 0 && +d.plannedMinutes > 0 &&
      +d.actualMinutes > +d.plannedMinutes * 1.5);
  }

  function pct(rate) {
    if (rate === null || rate === undefined || isNaN(rate)) return '—';
    return (Math.round(rate * 1000) / 10).toFixed(1) + '%';
  }

  /* 首页模块摘要卡：一个主数字 + 一行说明 */
  function aggregateModule(key) {
    var w = currentWeek(), r = weekRange(w);
    if (key === 'listening') {
      var ls = logsInRange('listening', r);
      var last = ls[0];
      return {
        value: ls.length ? ls.length + ' 次' : '还没开始',
        caption: last ? '最近倍速 ' + (last.speed || '1.0') + '×' : '本周精听次数'
      };
    }
    if (key === 'reading') {
      var rs = logsInRange('reading', r), t = 0, c = 0;
      rs.forEach(function (x) { t += (+x.total || 0); c += (+x.correct || 0); });
      return {
        value: t > 0 ? pct(c / t) : '还没开始',
        caption: rs[0] ? '最近：' + rs[0].type : '本周正确率'
      };
    }
    if (key === 'writing') {
      var ws = logsOf('writing'), sno = 0;
      ws.forEach(function (x) { sno += (x.sentences || []).length; });
      return {
        value: ws.length ? ws.length + ' 篇' : '还没开始',
        caption: '句式库 ' + sno + ' 条'
      };
    }
    if (key === 'translation') {
      var ts = logsOf('translation'), col = 0;
      ts.forEach(function (x) { col += (x.collocations || []).length; });
      return {
        value: ts.length ? ts.length + ' 段' : '还没开始',
        caption: '搭配 ' + col + ' 个'
      };
    }
    if (key === 'vocab') {
      var lp = listProgress(), wrong = 0;
      logsOf('vocab').forEach(function (x) { wrong += (x.wrongWords || []).length; });
      return { value: lp.done + '/' + lp.total, caption: '错词 ' + wrong + ' 个' };
    }
    if (key === 'mock') {
      var tr = mockTrend();
      if (!tr.length) return { value: '还没开始', caption: '本周六模考' };
      var lastS = tr[tr.length - 1];
      var delta = tr.length > 1 ? lastS.score - tr[tr.length - 2].score : 0;
      return {
        value: String(lastS.score),
        caption: tr.length > 1 ? '较上次 ' + (delta >= 0 ? '+' : '') + delta : '首次模考'
      };
    }
    /* review */
    var rev = reviewOf(w);
    var comp = completion(weekRange(w));
    return {
      value: comp.due ? pct(comp.rate) : '还没开始',
      caption: rev && rev.weekBlocker ? rev.weekBlocker : '本周完成率'
    };
  }

  return {
    setState: setState, getState: getState, setToday: setToday, resetToday: resetToday,
    todayISO: todayISO, parseISO: parseISO, addDays: addDays, fmtDate: fmtDate,
    weekIndexOf: weekIndexOf, weekRange: weekRange, weekLabel: weekLabel,
    currentWeek: currentWeek, weekdayOf: weekdayOf, inRange: inRange,
    dueDays: dueDays, day: day, completion: completion, totalProgress: totalProgress,
    moduleMinutes: moduleMinutes, logsOf: logsOf, logsInRange: logsInRange,
    autoCounts: autoCounts, reviewOf: reviewOf, entryOf: entryOf,
    moduleAccuracy: moduleAccuracy, mockTrend: mockTrend, errorDist: errorDist,
    listProgress: listProgress, countdown: countdown, isOvertime: isOvertime,
    pct: pct, aggregateModule: aggregateModule
  };
})();

<script>
/* src/core/router.js */
/* CET-4 备考台 · hash 路由：home / today / data / m/<key> */
window.CET4 = window.CET4 || {};

CET4.Router = (function () {
  var handler = null;

  function parse() {
    var raw = (location.hash || '').replace(/^#\/?/, '');
    var q = raw.indexOf('?');
    if (q >= 0) raw = raw.slice(0, q);
    var parts = raw.split('/').filter(function (s) { return s.length > 0; });
    var page = parts[0] || 'home';
    return { page: page, arg: parts[1] || null, raw: raw };
  }

  function emit() { if (handler) handler(parse()); }

  function start(fn) {
    handler = fn;
    window.addEventListener('hashchange', emit);
    emit();
  }

  function go(hash) {
    if (location.hash === hash) { emit(); return; }
    location.hash = hash;
  }

  return { start: start, go: go, parse: parse, emit: emit };
})();

<script>
/* src/core/actions.js */
/* CET-4 备考台 · 共享动作（打卡、备忘、导入导出） */
window.CET4 = window.CET4 || {};

CET4.A = (function () {
  function refresh() { CET4.App.refresh(); }
  function D() { return CET4.D; }

  function setStatus(iso, status) {
    CET4.Store.update(function (s) {
      var d = s.days[iso];
      if (!d) return;
      d.status = status;
      d.updatedAt = new Date().toISOString();
    });
    refresh();
    if (status === 'done') CET4.UI.toast('已打卡：完成', 'ok');
    else if (status === 'missed') CET4.UI.toast('已标记：未完成', 'warn');
  }

  function addMemo(text) {
    var t = String(text || '').trim();
    if (!t) return false;
    CET4.Store.update(function (s) {
      s.memos.unshift({
        id: CET4.Store.nextId('memo'),
        text: t.slice(0, 80),
        done: false,
        createdAt: new Date().toISOString()
      });
    });
    refresh();
    return true;
  }

  function toggleMemo(id) {
    CET4.Store.update(function (s) {
      for (var i = 0; i < s.memos.length; i++) {
        if (s.memos[i].id === id) { s.memos[i].done = !s.memos[i].done; return; }
      }
    });
    refresh();
  }

  function delMemo(id) {
    CET4.Store.update(function (s) {
      s.memos = s.memos.filter(function (m) { return m.id !== id; });
    });
    refresh();
  }

  function exportNow() {
    CET4.Store.flush();
    var txt = CET4.Store.exportText();
    var name = CET4.Store.exportFilename();
    var blob = new Blob([txt], { type: 'application/json;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    CET4.Store.markExported();
    CET4.UI.toast('已导出 ' + name, 'ok');
    refresh();
  }

  function importPick() {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json,application/json';
    input.style.display = 'none';
    document.body.appendChild(input);
    input.addEventListener('change', function () {
      var f = input.files && input.files[0];
      if (!f) { cleanup(); return; }
      var reader = new FileReader();
      reader.onload = function () {
        var r = CET4.Store.importText(String(reader.result || ''));
        cleanup();
        if (r.ok) { CET4.UI.toast('导入成功，已替换全部数据', 'ok'); CET4.App.fullRefresh(); }
        else { CET4.UI.toast(r.error, 'bad'); }
      };
      reader.onerror = function () { cleanup(); CET4.UI.toast('读取文件失败', 'bad'); };
      reader.readAsText(f, 'utf-8');
      function cleanup() { if (input.parentNode) input.parentNode.removeChild(input); }
    });
    input.click();
  }

  return {
    setStatus: setStatus,
    addMemo: addMemo, toggleMemo: toggleMemo, delMemo: delMemo,
    exportNow: exportNow, importPick: importPick
  };
})();
