        + (D.isOvertime(tday) ? ' · 已超 1.5 倍' : '')
      ),
      h('div', { class: 'row gap mt' },
        h('button', {
          class: 'btn btn-ok', text: '完成',
          onclick: function () { CET4.A.setStatus(today, 'done'); }
        }),
        h('button', {
          class: 'btn btn-ghost', text: '未完成',
          onclick: function () { CET4.A.setStatus(today, 'missed'); }
        }),
        h('a', { class: 'btn btn-ghost', href: '#/today', text: '写详情' })
      )
    ));
  }

  /* ---------- 3 快速备忘 ---------- */
  var memos = S.memos || [];
  var open = memos.filter(function (m) { return !m.done; });
  var doneMemos = memos.filter(function (m) { return m.done; });

  var memoInput = h('input', {
    class: 'input', type: 'text', maxlength: '80',
    placeholder: '随手记一句（回车添加）'
  });
  var memoForm = h('form', {
    class: 'row gap',
    onsubmit: function (e) {
      e.preventDefault();
      if (CET4.A.addMemo(memoInput.value)) memoInput.value = '';
    }
  }, memoInput, h('button', { class: 'btn btn-primary', type: 'submit', text: '添加' }));

  var memoList = h('ul', { class: 'memo-list' });
  if (!open.length) {
    memoList.appendChild(h('li', { class: 'empty-line', text: '没有待办备忘' }));
  }
  open.slice(0, 8).forEach(function (m) {
    memoList.appendChild(h('li', { class: 'memo' },
      h('input', {
        type: 'checkbox', class: 'cb',
        onchange: function () { CET4.A.toggleMemo(m.id); }
      }),
      h('span', { class: 'memo-txt', text: m.text }),
      h('button', {
        class: 'icon-btn', title: '删除', text: '×',
        onclick: function () { CET4.A.delMemo(m.id); }
      })
    ));
  });

  page.appendChild(h('h2', { class: 'sec-h' }, '快速备忘',
    h('span', { class: 'muted sub', text: open.length ? open.length + ' 条待办' : '' })));
  page.appendChild(h('section', { class: 'card' },
    memoForm, memoList,
    open.length > 8 ? h('div', { class: 'muted', text: '还有 ' + (open.length - 8) + ' 条，去「数据」页查看' }) : null,
    doneMemos.length ? h('details', { class: 'memo-done' },
      h('summary', { text: '已完成 ' + doneMemos.length + ' 条' }),
      h('ul', { class: 'memo-list' },
        doneMemos.slice(0, 20).map(function (m) {
          return h('li', { class: 'memo done' },
            h('input', {
              type: 'checkbox', class: 'cb', checked: true,
              onchange: function () { CET4.A.toggleMemo(m.id); }
            }),
            h('span', { class: 'memo-txt', text: m.text }),
            h('button', {
              class: 'icon-btn', title: '删除', text: '×',
              onclick: function () { CET4.A.delMemo(m.id); }
            })
          );
        })
      )
    ) : null
  ));

  /* ---------- 4 本周七天 ---------- */
  var strip = h('div', { class: 'weekstrip' });
  D.dueDays(wr).forEach(function (iso) { strip.appendChild(weekCell(iso)); });
  /* 未来几天也给格子，只是不显示状态 */
  for (var i = 0; i < 7; i++) {
    var iso = D.addDays(wr.start, i);
    if (iso > today) strip.appendChild(weekCell(iso));
  }

  page.appendChild(h('div', { class: 'row between sec-h' },
    h('h2', { text: '本周 · ' + D.weekLabel(w) }),
    h('a', { class: 'link', href: '#/today/week', text: '本周任务' })
  ));
  var comp = D.completion(wr);
  page.appendChild(h('section', { class: 'card' },
    h('div', { class: 'row between' },
      h('span', { class: 'muted', text: '本周完成率' }),
      h('b', { text: comp.due ? D.pct(comp.rate) : '—' })
    ),
    h('div', { class: 'bar' },
      h('div', { class: 'bar-fill', style: { width: (comp.rate ? comp.rate * 100 : 0) + '%' } })
    ),
    h('div', { class: 'muted', text: comp.done + ' / ' + comp.due + ' 天已完成（未来天数不计入分母）' }),
    strip
  ));

  /* ---------- 5 模块摘要 ---------- */
  var grid = h('div', { class: 'mgrid' });
  CET4.TAX.logModules.forEach(function (key) {
    var a = D.aggregateModule(key);
    var title = CET4.TAX.logTitles[key];
    grid.appendChild(h('a', {
      class: 'mcard', href: '#/m/' + key,
      style: { '--mc': CET4.TAX.colors[title] }
    },
      h('span', { class: 'mname', text: title }),
      h('b', { class: 'mval', text: a.value }),
      h('span', { class: 'mcap', text: a.caption })
    ));
  });
  var rev = D.aggregateModule('review');
  grid.appendChild(h('a', {
    class: 'mcard', href: '#/data/review',
    style: { '--mc': CET4.TAX.colors['休息'] }
  },
    h('span', { class: 'mname', text: '周复盘' }),
    h('b', { class: 'mval', text: rev.value }),
    h('span', { class: 'mcap', text: rev.caption })
  ));

  page.appendChild(h('h2', { class: 'sec-h' }, '各模块摘要'));
  page.appendChild(grid);

  /* ---------- 6 保存状态 ---------- */
  var saveBad = CET4.Store.isFailed() || !CET4.Store.available();
  page.appendChild(h('section', { class: 'card saves' },
    h('div', { class: 'row between' },
      h('span', { class: 'muted', text: '本地保存' }),
      h('span', { class: saveBad ? 'bad' : 'ok', text: saveBad ? '不可用（可能开了无痕模式）' : '正常' })
    ),
    h('div', { class: 'row between' },
      h('span', { class: 'muted', text: '上次自动保存' }),
      h('span', { text: U.fmtStamp(CET4.Store.get().savedAt) })
    ),
    h('div', { class: 'row between' },
      h('span', { class: 'muted', text: '上次导出备份' }),
      h('span', { text: U.fmtStamp(S.settings.lastExportAt) })
    ),
    h('div', { class: 'row gap mt' },
      h('button', {
        class: 'btn btn-ghost', text: '立即保存',
        onclick: function () {
          var ok = CET4.Store.flush();
          U.toast(ok ? '已保存到本机浏览器' : '保存失败：存储不可用', ok ? 'ok' : 'bad');
          CET4.App.refresh();
        }
      }),
      h('button', { class: 'btn btn-primary', text: '导出备份', onclick: CET4.A.exportNow }),
      h('a', { class: 'btn btn-ghost', href: '#/data/settings', text: '设置' })
    )
  ));

  main.appendChild(page);

  function weekCell(iso) {
    var d = D.day(iso);
    var isToday = iso === today;
    var st = !d ? 'none' : d.status;
    var cls = 'wcell' + (isToday ? ' is-today' : '') + ' st-' + st;
    return h('a', {
      class: cls, href: '#/today',
      style: { '--mc': d ? (CET4.TAX.colors[d.module] || '#5b8cff') : '#3a4354' },
      title: d ? d.module + ' · ' + d.task : '无计划'
    },
      h('span', { class: 'wd', text: D.weekdayOf(iso).replace('周', '') }),
      h('span', { class: 'wdate', text: String(+iso.slice(8)) }),
      h('span', { class: 'wdot' })
    );
  }
};

</script>
<script>
/* src/views/today.js */
﻿/* CET-4 备考台 · 今日计划（今天 / 本周 / 全部） */
window.CET4 = window.CET4 || {};
CET4.Views = CET4.Views || {};

/* 展开中的日期放在视图函数外，重渲染后仍保留 */
var _openIso = null;

CET4.Views.today = function (main, arg) {
  var h = CET4.UI.h, U = CET4.UI, D = CET4.D;
  var mode = arg === 'week' ? 'week' : arg === 'all' ? 'all' : 'today';
  var today = D.todayISO();
  var cards = {};
  var openIso = _openIso;
  function setOpen(v) { openIso = v; _openIso = v; }

  var MODKEY = {
    '听力': 'listening', '阅读': 'reading', '写作': 'writing',
    '翻译': 'translation', '词汇': 'vocab', '模考': 'mock'
  };

  U.clear(main);
  var page = h('div', { class: 'page' });

  page.appendChild(h('div', { class: 'seg' },
    segLink('今天', '#/today', mode === 'today'),
    segLink('本周', '#/today/week', mode === 'week'),
    segLink('全部', '#/today/all', mode === 'all')
  ));

  if (mode === 'today') {
    var d0 = D.day(today);
    var cd = D.countdown();
    page.appendChild(h('p', { class: 'muted', text:
      '今天 ' + U.fmtClock(today) + ' ' + D.weekdayOf(today) +
      (D.weekIndexOf(today) ? ' · ' + D.weekLabel(D.weekIndexOf(today)) : '') +
      (cd.phase === 'after' ? ' · 考试已结束' : ' · 距离考试 ' + cd.days + ' 天') }));
    if (!d0) {
      page.appendChild(h('section', { class: 'card empty' },
        h('p', { text: '今天不在 48 天计划区间内。' }),
        h('a', { class: 'btn btn-ghost', href: '#/today/all', text: '查看全部 48 天' })
      ));
    } else {
      var card = renderDay(today);
      cards[today] = card;
      page.appendChild(card);
      if (MODKEY[d0.module]) {
        page.appendChild(h('a', {
          class: 'btn btn-ghost wide', href: '#/m/' + MODKEY[d0.module],
          text: '记一条「' + d0.module + '」细节 →'
        }));
      }
    }
  } else {
    var weeks = mode === 'week' ? [D.currentWeek()] : CET4.TAX.weeks.map(function (x) { return x.idx; });
    weeks.forEach(function (wi) {
      var w = D.weekRange(wi);
      var comp = D.completion(w);
      page.appendChild(h('div', { class: 'row between sec-h' },
        h('h2', { text: D.weekLabel(wi) + ' · ' + U.fmtClock(w.start) + '–' + U.fmtClock(w.end) }),
        h('span', { class: 'muted', text: comp.due ? D.pct(comp.rate) : '—' })
      ));
      var list = h('div', { class: 'day-list' });
      for (var i = 0; i < 7; i++) {
        var iso = D.addDays(w.start, i);
        if (iso < w.start || iso > w.end) continue;
        var node;
        if (openIso === iso) { node = renderDay(iso); cards[iso] = node; }
        else { node = renderCompact(iso); }
        list.appendChild(node);
      }
      page.appendChild(list);
    });
  }

  main.appendChild(page);

  /* ---------------- 组件 ---------------- */

  function segLink(label, href, active) {
    return h('a', { class: 'seg-item' + (active ? ' active' : ''), href: href, text: label });
  }

  function statusLabel(st) {
    return st === 'done' ? '已完成' : st === 'missed' ? '未完成' : '未打卡';
  }
  function statusCls(st) {
    return st === 'done' ? 'badge badge-ok' : st === 'missed' ? 'badge badge-bad' : 'badge';
  }

  function renderCompact(iso) {
    var d = D.day(iso);
    return h('button', {
      class: 'day-compact' + (iso === today ? ' is-today' : '') +
        (D.isOvertime(d) ? ' ot' : '') + (d.status === 'missed' ? ' missed' : ''),
      style: { '--mc': CET4.TAX.colors[d.module] || '#5b8cff' },
      onclick: function () { setOpen(iso); CET4.App.refresh(); }
    },
      h('span', { class: 'dc-date', text: U.fmtClock(iso) + ' ' + D.weekdayOf(iso).replace('周', '') }),
      h('span', { class: 'pill pill-m', text: d.module }),
      h('span', { class: 'dc-task', text: d.task }),
      h('span', { class: 'dc-min', text: (d.status === 'done' && d.actualMinutes) ? U.fmtMinutes(d.actualMinutes) : U.fmtMinutes(d.plannedMinutes) }),
      h('span', { class: statusCls(d.status), text: statusLabel(d.status) })
    );
  }

  function renderDay(iso) {
    var d = D.day(iso);
    if (!d) return h('div');
    var card = h('article', {
      class: 'card day' + (D.isOvertime(d) ? ' ot' : '') + (d.status === 'missed' ? ' missed' : '') +
        (iso === today ? ' is-today' : ''),
      style: { '--mc': CET4.TAX.colors[d.module] || '#5b8cff' }
    });

    card.appendChild(h('div', { class: 'row between' },
      h('div', { class: 'row gap8 wrap' },
        h('span', { class: 'day-date', text: U.fmtClock(iso) }),
        h('span', { class: 'muted', text: D.weekdayOf(iso) }),
        h('span', { class: 'pill pill-m', text: d.module }),
        D.isOvertime(d) ? h('span', { class: 'badge badge-warn', text: '超时 1.5×' }) : null
      ),
      (iso !== today && openIso === iso)
        ? h('button', { class: 'icon-btn txt', text: '收起', onclick: function () { setOpen(null); CET4.App.refresh(); } })
        : null
    ));

    /* 状态 */
    var stRow = h('div', { class: 'status-row' });
    [['done', '完成'], ['missed', '未完成'], ['unset', '清除']].forEach(function (pair) {
      stRow.appendChild(h('button', {
        class: 'sbtn' + (d.status === pair[0] ? ' on' : '') +
          (pair[0] === 'done' ? ' sbtn-ok' : pair[0] === 'missed' ? ' sbtn-bad' : ''),
        text: pair[1],
        onclick: function () { setStatus(iso, pair[0]); }
      }));
    });
    card.appendChild(stRow);

    /* 任务文本 */
    var taskInput = h('textarea', {
      class: 'input area-task', rows: '2', placeholder: '今天要做什么',
      oninput: function () { setText(iso, 'task', taskInput.value); }
    });
    taskInput.value = d.task || '';
    card.appendChild(h('div', { class: 'field' },
      h('label', { class: 'label', text: '计划任务（可改）' }), taskInput));

    /* 时长 */
    var planNum = h('input', {
      class: 'input num', type: 'number', inputmode: 'numeric', min: '0', max: '600',
      oninput: function () { setNum(iso, 'plannedMinutes', planNum.value); refreshOt(); }
    });
    planNum.value = d.plannedMinutes == null ? '' : d.plannedMinutes;

    var actNum = h('input', {
      class: 'input num', type: 'number', inputmode: 'numeric', min: '0', max: '600',
      oninput: function () { setNum(iso, 'actualMinutes', actNum.value); refreshOt(); }
    });
    actNum.value = d.actualMinutes == null ? '' : d.actualMinutes;

    card.appendChild(h('div', { class: 'grid2' },
      h('div', { class: 'field' },
        h('label', { class: 'label', text: '计划时长（分钟）' }), planNum),
      h('div', { class: 'field' },
        h('label', { class: 'label', text: '实际时长（分钟）' }), actNum)
    ));

    /* 卡点 / 调整 */
    card.appendChild(labeledText(iso, 'blocker', 60, '例如：注意力不集中；信息标注缺失', '今日最大卡点'));
    card.appendChild(labeledText(iso, 'adjustment', 60, '例如：将细节信息标注清楚+与问题快速对应', '明日调整'));

    /* 小步骤 */
    var steps = h('div', { class: 'steps' });
    if (!d.steps.length) {
      steps.appendChild(h('div', { class: 'empty-line', text: '把它拆成 1–3 个小步骤' }));
    }
    d.steps.forEach(function (st) {
      var row = h('div', { class: 'step' + (st.done ? ' done' : '') });
      row.appendChild(h('input', {
        type: 'checkbox', class: 'cb', checked: st.done ? true : null,
        onchange: function () {
          CET4.Store.update(function (s) {
            var arr = s.days[iso].steps;
            for (var i = 0; i < arr.length; i++) if (arr[i].id === st.id) arr[i].done = !arr[i].done;
          });
          row.classList.toggle('done');
        }
      }));
      var si = h('input', {
        class: 'input step-input', type: 'text', maxlength: '60', placeholder: '小步骤',
        oninput: function () {
          var v = si.value;
          CET4.Store.update(function (s) {
            var arr = s.days[iso].steps;
            for (var i = 0; i < arr.length; i++) if (arr[i].id === st.id) arr[i].text = v;
          });
        }
      });
      si.value = st.text || '';
      row.appendChild(si);
      row.appendChild(h('button', {
        class: 'icon-btn', text: '×', title: '删除步骤',
        onclick: function () {
          CET4.Store.update(function (s) {
            s.days[iso].steps = s.days[iso].steps.filter(function (x) { return x.id !== st.id; });
          });
          replace(iso);
        }
      }));
      steps.appendChild(row);
    });

    card.appendChild(h('div', { class: 'field' },
      h('label', { class: 'label', text: '小步骤' }),
      steps,
      h('button', {
        class: 'btn btn-ghost sm', text: '+ 加一步',
        onclick: function () {
          if (D.day(iso).steps.length >= 8) { U.toast('最多 8 步', 'warn'); return; }
          CET4.Store.update(function (s) {
            s.days[iso].steps.push({ id: CET4.Store.nextId('st'), text: '', done: false });
          });
          replace(iso);
        }
      })
    ));

    card.appendChild(h('div', { class: 'muted foot', text: '最后修改：' + (d.updatedAt ? U.fmtStamp(d.updatedAt) : '未修改') }));

    function refreshOt() {
      card.classList.toggle('ot', D.isOvertime(D.day(iso)));
    }

    return card;
  }

  /* 就地替换单张卡，保留其余卡片与滚动位置 */
  function replace(iso) {
    var old = cards[iso];
    var fresh = renderDay(iso);
    cards[iso] = fresh;
    if (old && old.parentNode) old.parentNode.replaceChild(fresh, old);
    else CET4.App.refresh();
  }

  function labeledText(iso, key, max, ph, labelText) {
    var counter = h('span', { class: 'counter', text: (D.day(iso)[key] || '').length + '/' + max });
    var input = h('input', {
      class: 'input', type: 'text', maxlength: max, placeholder: ph,
      oninput: function () {
        var v = input.value;
        setText(iso, key, v);
        counter.textContent = v.length + '/' + max;
      }
    });
    input.value = D.day(iso)[key] || '';
    return h('div', { class: 'field' },
      h('label', { class: 'label' }, labelText, counter), input);
  }

  function setText(iso, key, v) {
    CET4.Store.update(function (s) {
      s.days[iso][key] = v;
      s.days[iso].updatedAt = new Date().toISOString();
    });
  }

  function setNum(iso, key, v) {
    CET4.Store.update(function (s) {
      s.days[iso][key] = v === '' ? null : Math.max(0, Math.round(+v));
      s.days[iso].updatedAt = new Date().toISOString();
    });
  }

  function setStatus(iso, status) {
    CET4.Store.update(function (s) {
      s.days[iso].status = status;
      s.days[iso].updatedAt = new Date().toISOString();
    });
    replace(iso);
    U.toast(status === 'done' ? '已打卡：完成' : status === 'missed' ? '已标记：未完成' : '已清除打卡',
      status === 'missed' ? 'warn' : 'ok');
  }
};

</script>
<script>
/* src/views/modules.js */
/* CET-4 备考台 · 六个模块的专属记录页 */
window.CET4 = window.CET4 || {};
CET4.Views = CET4.Views || {};

(function () {
  var U = CET4.UI;
  var h = U.h;

  function rateStr(c, t) {
    if (!t) return '—';
    return CET4.D.pct(c / t);
  }

  var SPECS = {
    listening: {
      title: '听力', accent: '#5b8cff',
      hint: '记什么：材料类型 / 精听方式 / 倍速 / 信号词 / 错题重听数',
      fields: [
        { key: 'date', label: '日期', type: 'date', required: true },
        { key: 'material', label: '材料类型', type: 'select', options: CET4.TAX.listeningMaterials, required: true },
        { key: 'methods', label: '精听方式', type: 'checks', options: CET4.TAX.listeningMethods, required: true },
        { key: 'speed', label: '倍速', type: 'select', options: ['1.0', '1.25', '1.5'], def: '1.0' },
        { key: 'signalWords', label: '信号词', type: 'tags', placeholder: 'but，however，so', hint: '逗号分隔' },
        { key: 'wrongReplay', label: '错题重听数', type: 'num', min: 0 },
        { key: 'note', label: '备注', type: 'textarea', rows: '2' }
      ],
      summary: function (l) {
        return l.material + ' · ' + (l.methods || []).join('/') + ' · ' + (l.speed || '1.0') + '×';
      },
      detail: function (l) {
        var bits = [];
        if ((l.signalWords || []).length) bits.push('信号词：' + l.signalWords.join('、'));
        if (l.wrongReplay) bits.push('重听 ' + l.wrongReplay + ' 题');
        if (l.note) bits.push(l.note);
        return bits.join(' · ');
      },
      stat: function (arr) {
        if (!arr.length) return '共 0 次';
        return '共 ' + arr.length + ' 次 · 最近倍速 ' + (arr[0].speed || '1.0') + '×';
      }
    },

    reading: {
      title: '阅读', accent: '#34c98b',
      hint: '记什么：题型 / 题数 / 正确数 / 限时 / 错因 / 定位线索',
      fields: [
        { key: 'date', label: '日期', type: 'date', required: true },
        { key: 'type', label: '题型', type: 'select', options: CET4.TAX.readingTypes, required: true },
        { key: 'total', label: '题数', type: 'num', min: 0, required: true, live: 'rate' },
        { key: 'correct', label: '正确数', type: 'num', min: 0, required: true, live: 'rate' },
        { key: 'limitMinutes', label: '限时（分钟）', type: 'num', min: 0 },
        { key: 'errorType', label: '错因分类', type: 'select', options: ['（未选）'].concat(CET4.TAX.errorTypes) },
        { key: 'locateClue', label: '定位线索', type: 'text', placeholder: '题干圈出的关键词 / 原文出处' },
        { key: 'note', label: '备注', type: 'textarea', rows: '2' }
      ],
      summary: function (l) {
        return l.type + ' · ' + (l.correct || 0) + '/' + (l.total || 0) + ' · ' + rateStr(l.correct, l.total);
      },
      detail: function (l) {
        var bits = [];
        if (l.limitMinutes) bits.push('限时 ' + l.limitMinutes + ' 分钟');
        if (l.errorType) bits.push('错因：' + l.errorType);
        if (l.locateClue) bits.push('线索：' + l.locateClue);
        if (l.note) bits.push(l.note);
        return bits.join(' · ');
      },
      stat: function (arr) {
        var t = 0, c = 0;
        arr.forEach(function (x) { t += (+x.total || 0); c += (+x.correct || 0); });
        return '共 ' + arr.length + ' 篇 · 累计正确率 ' + rateStr(c, t);
      }
    },

    writing: {
      title: '写作', accent: '#f0a23b',
      hint: '记什么：作文类型 / 提纲 / 句式 / 用时 / 自评',
      fields: [
        { key: 'date', label: '日期', type: 'date', required: true },
        { key: 'essayType', label: '作文类型', type: 'select', options: CET4.TAX.essayTypes, required: true },
        { key: 'outline', label: '提纲', type: 'textarea', rows: '2', placeholder: '第一段… 第二段… 第三段…' },
        { key: 'sentences', label: '可复用句式', type: 'tags', placeholder: 'It is widely acknowledged that…', hint: '逗号分隔，自动进句式库' },
        { key: 'minutes', label: '用时（分钟）', type: 'num', min: 0 },
        { key: 'selfReview', label: '自评', type: 'textarea', rows: '2', placeholder: '哪一段最弱 / 下次改什么' },
        { key: 'note', label: '备注', type: 'textarea', rows: '2' }
      ],
      summary: function (l) {
        return l.essayType + ' · ' + ((l.sentences || []).length) + ' 条句式';
      },
      detail: function (l) {
        var bits = [];
        if (l.minutes) bits.push('用时 ' + l.minutes + ' 分钟');
        if (l.outline) bits.push('提纲：' + l.outline);
        if (l.selfReview) bits.push('自评：' + l.selfReview);
        return bits.join(' · ');
      },
      stat: function (arr) {
        var n = 0;
        arr.forEach(function (x) { n += (x.sentences || []).length; });
        return '共 ' + arr.length + ' 篇 · 句式库 ' + n + ' 条';
      }
    },

    translation: {
      title: '翻译', accent: '#c77dff',
      hint: '记什么：主题 / 自译 / 参考译文 / 固定搭配 / 用时',
      fields: [
        { key: 'date', label: '日期', type: 'date', required: true },
        { key: 'topic', label: '主题', type: 'select', options: CET4.TAX.translationTopics, required: true },
        { key: 'selfText', label: '自译', type: 'textarea', rows: '3' },
        { key: 'refText', label: '参考译文', type: 'textarea', rows: '3' },
        { key: 'collocations', label: '固定搭配', type: 'tags', placeholder: 'play a vital role in，with the development of', hint: '逗号分隔' },
        { key: 'minutes', label: '用时（分钟）', type: 'num', min: 0 },
        { key: 'note', label: '备注', type: 'textarea', rows: '2' }
      ],
      summary: function (l) {
        return l.topic + ' · ' + ((l.collocations || []).length) + ' 个搭配';
      },
      detail: function (l) {
        var bits = [];
        if (l.minutes) bits.push('用时 ' + l.minutes + ' 分钟');
        if (l.selfText) bits.push('自译：' + l.selfText);
        if (l.note) bits.push(l.note);
        return bits.join(' · ');
      },
      stat: function (arr) {
        var n = 0;
        arr.forEach(function (x) { n += (x.collocations || []).length; });
        return '共 ' + arr.length + ' 段 · 搭配 ' + n + ' 个';
      }
    },

    vocab: {
      title: '词汇', accent: '#2fc7d6',
      hint: '记什么：List 编号 / 词数 / 错词 / 熟词僻义',
      fields: [
        { key: 'date', label: '日期', type: 'date', required: true },
        { key: 'list', label: 'List 编号', type: 'select', options: ['1', '2', '3', '4', '5', '6'], required: true },
        { key: 'wordCount', label: '本 List 词数', type: 'num', min: 0, def: 60 },
        { key: 'wrongWords', label: '错词', type: 'tags', placeholder: 'abandon，derive', hint: '逗号分隔' },
        { key: 'rareMeanings', label: '熟词僻义', type: 'tags', placeholder: 'address v. 处理', hint: '逗号分隔' },
        { key: 'note', label: '备注', type: 'textarea', rows: '2' }
      ],
      summary: function (l) {
        return 'List ' + l.list + ' · ' + (l.wordCount || 60) + ' 词 · 错词 ' + ((l.wrongWords || []).length);
      },
      detail: function (l) {
        var bits = [];
        if ((l.wrongWords || []).length) bits.push('错词：' + l.wrongWords.join('、'));
        if ((l.rareMeanings || []).length) bits.push('僻义：' + l.rareMeanings.join('、'));
        if (l.note) bits.push(l.note);
        return bits.join(' · ');
      },
      stat: function () {
        var lp = CET4.D.listProgress(), wrong = 0;
        CET4.D.logsOf('vocab').forEach(function (x) { wrong += (x.wrongWords || []).length; });
        return 'List 进度 ' + lp.done + '/' + lp.total + ' · 错词 ' + wrong + ' 个';
      }
    },

    mock: {
      title: '模考', accent: '#ef5f6b',
      hint: '记什么：卷型 / 听力对题 / 阅读对题 / 估分 / 用时',
      fields: [
        { key: 'date', label: '日期', type: 'date', required: true },
        { key: 'examType', label: '卷型', type: 'select', options: CET4.TAX.mockTypes, required: true },
        { key: 'listeningCorrect', label: '听力正确数', type: 'num', min: 0 },
        { key: 'listeningTotal', label: '听力总题数', type: 'num', min: 0, def: 25 },
        { key: 'readingCorrect', label: '阅读正确数', type: 'num', min: 0 },
        { key: 'readingTotal', label: '阅读总题数', type: 'num', min: 0, def: 30 },
        { key: 'estimate', label: '估分', type: 'num', min: 0, max: 710, live: 'estimate' },
        { key: 'minutes', label: '用时（分钟）', type: 'num', min: 0 },
        { key: 'note', label: '备注', type: 'textarea', rows: '2' }
      ],
      summary: function (l) {
        return l.examType + ' · 估分 ' + (l.estimate == null ? '—' : l.estimate);
      },
      detail: function (l) {
        var bits = [];
        if (l.listeningTotal) bits.push('听力 ' + (l.listeningCorrect || 0) + '/' + l.listeningTotal);
        if (l.readingTotal) bits.push('阅读 ' + (l.readingCorrect || 0) + '/' + l.readingTotal);
        if (l.minutes) bits.push('用时 ' + l.minutes + ' 分钟');
        if (l.note) bits.push(l.note);
        return bits.join(' · ');
      },
      stat: function () {
        var tr = CET4.D.mockTrend();
        if (!tr.length) return '共 0 次';
        return '共 ' + tr.length + ' 次 · 最新估分 ' + tr[tr.length - 1].score;
      }
    }
  };

  CET4.Views.modules = function (main, key) {
    var spec = SPECS[key];
    var D = CET4.D;
    if (!spec) { CET4.Router.go('#/data'); return; }
    var logs = D.logsOf(key);

    U.clear(main);
    var page = h('div', { class: 'page' });

    page.appendChild(h('div', { class: 'page-head' },
      h('a', { class: 'icon-btn txt', href: '#/data', text: '← 返回' }),
      h('h1', { class: 'title', style: { color: spec.accent }, text: spec.title }),
      h('span', { class: 'muted', text: logs.length ? spec.stat(logs) : '' })
    ));

    page.appendChild(h('p', { class: 'muted small', text: spec.hint }));

    var formHost = h('div', { class: 'form-host' });
    page.appendChild(h('button', {
      class: 'btn btn-primary wide',
      text: '+ 新增' + spec.title + '记录',
      onclick: function () { openForm(null); }
    }));
    page.appendChild(formHost);

    var list = h('div', { class: 'rec-list' });
    if (!logs.length) {
      list.appendChild(h('div', { class: 'card empty' },
        h('p', { text: '还没有' + spec.title + '记录。' }),
        h('p', { class: 'muted', text: '点上面的按钮，记第一条。' })
      ));
    }
    logs.forEach(function (rec) { list.appendChild(recCard(rec)); });
    page.appendChild(list);
    page.appendChild(h('p', { class: 'muted center small', text: '共 ' + logs.length + ' 条记录' }));

    main.appendChild(page);

    function recCard(rec) {
      return h('article', { class: 'card rec', style: { '--mc': spec.accent } },
        h('div', { class: 'row between' },
          h('span', { class: 'rec-date', text: U.fmtClock(rec.date) + ' ' + D.weekdayOf(rec.date) }),
          h('div', { class: 'row gap8' },
            h('button', { class: 'icon-btn txt', text: '编辑', onclick: function () { openForm(rec); } }),
            h('button', {
              class: 'icon-btn txt danger', text: '删除',
              onclick: function () {
                U.ask({ title: '删除这条记录？', body: '删除后无法恢复。', okText: '删除', danger: true })
                  .then(function (yes) {
                    if (!yes) return;
                    CET4.Store.update(function (s) {
                      s.logs[key] = s.logs[key].filter(function (x) { return x.id !== rec.id; });
                    });
                    U.toast('已删除');
                    CET4.App.refresh();
                  });
              }
            })
          )
        ),
        h('div', { class: 'rec-main', text: spec.summary(rec) }),
        h('div', { class: 'muted small', text: spec.detail(rec) })
      );
    }

    function openForm(rec) {
      U.clear(formHost);
      var draft = rec ? JSON.parse(JSON.stringify(rec)) : {};
      if (!rec) SPECS[key].fields.forEach(function (f) {
        if (f.key === 'date') draft.date = D.todayISO();
        else if (f.def !== undefined) draft[f.key] = f.def;
        else if (f.type === 'checks') draft[f.key] = [];
        else draft[f.key] = '';
      });
      if (rec) { /* 允许改日期 */ }
      else if (!draft.date) draft.date = D.todayISO();

      var getters = [];
      var rateNote = h('div', { class: 'muted small' });

      var form = h('form', {
        class: 'card form',
        style: { '--mc': spec.accent },
        onsubmit: function (e) { e.preventDefault(); save(); }
      });
      var grid = h('div', { class: 'form-grid' });

      spec.fields.forEach(function (f) {
        var built = buildField(f, draft, rateNote);
        getters.push({ field: f, get: built.get, el: built.el });
        grid.appendChild(built.el);
      });

      form.appendChild(h('div', { class: 'row between' },
        h('b', { text: (rec ? '编辑' : '新增') + spec.title + '记录' }),
        h('button', { type: 'button', class: 'icon-btn txt', text: '取消', onclick: function () { U.clear(formHost); } })
      ));
      form.appendChild(grid);
      form.appendChild(rateNote);
      form.appendChild(h('div', { class: 'row gap mt' },
        h('button', { class: 'btn btn-primary', type: 'submit', text: '保存记录' }),
        h('button', { class: 'btn btn-ghost', type: 'button', text: '取消', onclick: function () { U.clear(formHost); } })
      ));
      formHost.appendChild(form);
      form.scrollIntoView({ behavior: 'smooth', block: 'start' });

      var firstText = form.querySelector('input,select,textarea');
      if (firstText) setTimeout(function () { try { firstText.focus(); } catch (e) { } }, 60);

      function save() {
        var obj = rec ? { id: rec.id } : { id: CET4.Store.nextId(key), createdAt: new Date().toISOString() };
        var missing = [];
        getters.forEach(function (g) {
          var v = g.get();
          if (g.field.required) {
            var empty = v === '' || v === null || v === undefined ||
              (Array.isArray(v) && v.length === 0) || (typeof v === 'number' && isNaN(v));
            if (empty) missing.push(g.field.label);
          }
          obj[g.field.key] = v;
        });
        if (missing.length) {
          U.toast('还需要填：' + missing.join('、'), 'bad');
          return;
        }
        CET4.Store.update(function (s) {
          if (rec) {
            var arr = s.logs[key];
            for (var i = 0; i < arr.length; i++) if (arr[i].id === rec.id) { arr[i] = obj; return; }
            arr.push(obj);
          } else {
            s.logs[key].push(obj);
          }
        });
        U.toast(rec ? '已更新' : '已保存', 'ok');
        CET4.App.refresh();
      }
    }

    function buildField(f, draft, rateNote) {
      var wrap = h('div', { class: 'field' + (f.type === 'textarea' ? ' field-wide' : '') });
      var lab = h('label', { class: 'label' }, f.label);
      if (f.required) lab.appendChild(h('span', { class: 'req', text: '*' }));
      if (f.hint) lab.appendChild(h('span', { class: 'counter', text: f.hint }));
      wrap.appendChild(lab);

      var get;

      if (f.type === 'date') {
        var di = h('input', { class: 'input', type: 'date' });
        di.value = draft[f.key] || CET4.D.todayISO();
        get = function () { return di.value; };
        wrap.appendChild(di);

      } else if (f.type === 'select') {
        var sel = h('select', { class: 'input' });
        f.options.forEach(function (o) {
          sel.appendChild(h('option', { value: o, text: o }));
        });
        var want = draft[f.key] != null && draft[f.key] !== '' ? String(draft[f.key]) : (f.def != null ? String(f.def) : f.options[0]);
        sel.value = want;
        if (sel.value !== want) sel.value = f.options[0];
        get = function () { return sel.value; };
        wrap.appendChild(sel);

      } else if (f.type === 'num') {
        var ni = h('input', {
          class: 'input num', type: 'number', inputmode: 'numeric',
          min: f.min != null ? f.min : 0, max: f.max != null ? f.max : 9999
        });
        ni.value = (draft[f.key] == null || draft[f.key] === '') ? '' : draft[f.key];
        get = function () { return ni.value === '' ? null : Math.max(0, Math.round(+ni.value)); };
        wrap.appendChild(ni);

      } else if (f.type === 'checks') {
        var chosen = Array.isArray(draft[f.key]) ? draft[f.key].slice() : [];
        var boxWrap = h('div', { class: 'checks' });
        f.options.forEach(function (o) {
          var cb = h('input', { type: 'checkbox', class: 'cb', checked: chosen.indexOf(o) >= 0 ? true : null });
          boxWrap.appendChild(h('label', { class: 'check' }, cb, h('span', { text: o })));
        });
        get = function () {
          var out = [];
          var boxes = boxWrap.querySelectorAll('input[type="checkbox"]');
          for (var i = 0; i < boxes.length; i++) if (boxes[i].checked) out.push(f.options[i]);
          return out;
        };
        wrap.appendChild(boxWrap);

      } else if (f.type === 'tags') {
        var ti = h('input', { class: 'input', type: 'text', placeholder: f.placeholder || '' });
        ti.value = U.tagsToStr(draft[f.key]);
        get = function () { return U.parseTags(ti.value); };
        wrap.appendChild(ti);

      } else if (f.type === 'textarea') {
        var ta = h('textarea', { class: 'input', rows: f.rows || '3', placeholder: f.placeholder || '' });
        ta.value = draft[f.key] || '';
        get = function () { return ta.value; };
        wrap.appendChild(ta);

      } else {
        var xi = h('input', { class: 'input', type: 'text', placeholder: f.placeholder || '' });
        xi.value = draft[f.key] || '';
        get = function () { return xi.value; };
        wrap.appendChild(xi);
      }

      return { el: wrap, get: get };
    }
  };

  CET4.MODSPECS = SPECS;
})();

</script>
<script>
/* src/views/data.js */
/* CET-4 备考台 · 数据与设置：统计 / 复盘 / 设置 */
window.CET4 = window.CET4 || {};
CET4.Views = CET4.Views || {};

CET4.Views.data = function (main, arg) {
  var h = CET4.UI.h, U = CET4.UI, D = CET4.D;
  var tab = arg === 'review' ? 'review' : arg === 'settings' ? 'settings' : 'stats';

  U.clear(main);
  var page = h('div', { class: 'page' });

  page.appendChild(h('div', { class: 'seg' },
    segLink('统计', '#/data/stats', tab === 'stats'),
    segLink('复盘', '#/data/review', tab === 'review'),
    segLink('设置', '#/data/settings', tab === 'settings')
  ));

  if (tab === 'stats') page.appendChild(statsView());
  else if (tab === 'review') page.appendChild(reviewView());
  else page.appendChild(settingsView());

  main.appendChild(page);

  function segLink(label, href, active) {
    return h('a', { class: 'seg-item' + (active ? ' active' : ''), href: href, text: label });
  }

  /* ==================== 统计 ==================== */
  function statsView() {
    var wrap = h('div');
    var tp = D.totalProgress();

    wrap.appendChild(h('section', { class: 'card' },
      h('div', { class: 'row between' },
        h('span', { class: 'muted', text: '总完成率（已到期天数）' }),
        h('b', { class: 'big', text: D.pct(tp.rate) })
      ),
      h('div', { class: 'bar' },
        h('div', { class: 'bar-fill', style: { width: (tp.rate ? tp.rate * 100 : 0) + '%' } })
      ),
      h('div', { class: 'row between mt8' },
        h('span', { class: 'muted', text: '已到期 ' + tp.due + ' 天' }),
        h('span', { class: 'muted', text: '累计完成 ' + tp.done + ' / 48 天' })
      )
    ));

    var wk = D.currentWeek(), wr = D.weekRange(wk), wc = D.completion(wr);
    wrap.appendChild(h('section', { class: 'card' },
      h('div', { class: 'row between' },
        h('span', { class: 'muted', text: '本周完成率 · ' + D.weekLabel(wk) }),
        h('b', { text: D.pct(wc.rate) })
      ),
      h('div', { class: 'bar' },
        h('div', { class: 'bar-fill ok', style: { width: (wc.rate ? wc.rate * 100 : 0) + '%' } })
      ),
      h('div', { class: 'muted', text: wc.done + ' / ' + wc.due + ' 天' })
    ));

    /* 模块投入时长 */
    var allRange = { start: CET4.TAX.weeks[0].start, end: CET4.TAX.weeks[CET4.TAX.weeks.length - 1].end };
    var mins = CET4.TAX.modules.map(function (m) { return { m: m, v: D.moduleMinutes(m, allRange) }; });
    var maxMin = Math.max.apply(null, mins.map(function (x) { return x.v; }).concat([1]));
    wrap.appendChild(h('h2', { class: 'sec-h' }, '模块投入时长'));
    var c1 = h('section', { class: 'card' });
    mins.forEach(function (x) {
      c1.appendChild(barRow(x.m, x.v, maxMin, CET4.TAX.colors[x.m], U.fmtMinutes(x.v)));
    });
    wrap.appendChild(c1);

    /* 模考趋势 */
    var tr = D.mockTrend();
    wrap.appendChild(h('h2', { class: 'sec-h' }, '模考估分趋势'));
    var c2 = h('section', { class: 'card' });
    if (!tr.length) {
      c2.appendChild(h('div', { class: 'empty-line', text: '还没有模考记录，周六做完来记一条' }));
    } else {
      var lo = Math.min.apply(null, tr.map(function (x) { return x.score; }));
      var hi = Math.max.apply(null, tr.map(function (x) { return x.score; }));
      if (hi - lo < 40) { hi += 20; lo -= 20; }
      var bars = h('div', { class: 'vbars' });
      tr.slice(-8).forEach(function (p) {
        var pctH = Math.max(6, (p.score - lo) / (hi - lo) * 100);
        bars.appendChild(h('div', { class: 'vbar' },
          h('span', { class: 'vb-val', text: String(p.score) }),
          h('div', { class: 'vb-track' },
            h('div', { class: 'vb-col', style: { height: pctH + '%' } })
          ),
          h('span', { class: 'vb-lab', text: U.fmtClock(p.date) })
        ));
      });
      c2.appendChild(bars);
      c2.appendChild(h('div', { class: 'muted small', text: '目标 ' + (CET4.Store.get().settings.targetScore || 425) + ' · 共 ' + tr.length + ' 次模考' }));
    }
    wrap.appendChild(c2);

    /* 模块正确率（全部复盘合计，手改优先） */
    wrap.appendChild(h('h2', { class: 'sec-h' }, '模块正确率'));
    var c3 = h('section', { class: 'card' });
    var anyAcc = false;
    CET4.TAX.reviewModules.forEach(function (m) {
      var t = 0, c = 0;
      CET4.TAX.weeks.forEach(function (w) {
        var a = D.moduleAccuracy(w.idx, m);
        t += a.total; c += a.correct;
      });
      if (t > 0) anyAcc = true;
      c3.appendChild(barRow(m, t > 0 ? c / t : 0, 1, CET4.TAX.colors[m], t > 0 ? D.pct(c / t) : '—'));
    });
    if (!anyAcc) c3.appendChild(h('div', { class: 'muted small', text: '复盘里填了题数与正确数后，这里会自动出正确率' }));
    wrap.appendChild(c3);

    /* 错因分布 */
    var errs = D.errorDist('all');
    wrap.appendChild(h('h2', { class: 'sec-h' }, '错因分布'));
    var c4 = h('section', { class: 'card' });
    if (!errs.length) {
      c4.appendChild(h('div', { class: 'empty-line', text: '复盘时选了错因，这里会统计出现次数' }));
    } else {
      errs.sort(function (a, b) { return b.count - a.count; });
      var maxErr = errs[0].count;
      errs.slice(0, 11).forEach(function (e) {
        c4.appendChild(barRow(e.type, e.count, maxErr, '#ef5f6b', e.count + ' 次'));
      });
    }
    wrap.appendChild(c4);

    /* 模块记录入口 */
    wrap.appendChild(h('h2', { class: 'sec-h' }, '模块记录'));
    var grid = h('div', { class: 'mgrid' });
    CET4.TAX.logModules.forEach(function (key) {
      var title = CET4.TAX.logTitles[key];
      var logs = D.logsOf(key);
      grid.appendChild(h('a', {
        class: 'mcard', href: '#/m/' + key,
        style: { '--mc': CET4.TAX.colors[title] }
      },
        h('span', { class: 'mname', text: title }),
        h('b', { class: 'mval', text: String(logs.length) }),
        h('span', { class: 'mcap', text: '条记录' })
      ));
    });
    wrap.appendChild(grid);

    return wrap;
  }

  function barRow(label, value, max, color, text) {
    var pct = max > 0 ? Math.min(100, value / max * 100) : 0;
    return h('div', { class: 'bar-row' },
      h('span', { class: 'bl', text: label }),
      h('div', { class: 'bar thin' },
        h('div', { class: 'bar-fill', style: { width: pct + '%', background: color } })
      ),
      h('span', { class: 'bv', text: text })
    );
  }

  /* ==================== 复盘 ==================== */
  function reviewView() {
    var wrap = h('div');
    wrap.appendChild(h('p', { class: 'muted small', text:
      '每周日复盘：填题数/正确数，选错因，写下一套卷的 1 个调整动作。总题数留空时自动汇总当周阅读日志。' }));

    CET4.TAX.weeks.forEach(function (w) {
      var rev = D.reviewOf(w.idx);
      if (!rev) return;
      var comp = D.completion(w);
      var card = h('section', { class: 'card rv' },
        h('div', { class: 'row between' },
          h('b', { text: U.fmtClock(rev.reviewDate) + ' 复盘 · ' + w.label }),
          h('span', { class: 'muted', text: '完成率 ' + (comp.due ? D.pct(comp.rate) : '—') })
        )
      );
      CET4.TAX.reviewModules.forEach(function (m) {
        card.appendChild(reviewRow(rev, m));
      });
      card.appendChild(labeledInput(rev.weekIndex, 'weekBlocker', '本周最大卡点', 60));
      card.appendChild(labeledInput(rev.weekIndex, 'weekFocus', '下周 1 个重点', 60));
      wrap.appendChild(card);
    });
    return wrap;
  }

  function reviewRow(rev, module) {
    var acc = D.moduleAccuracy(rev.weekIndex, module);
    var auto = D.autoCounts(rev.weekIndex, module);

    var rateEl = h('span', { class: 'rv-rate', text: acc.total > 0 ? D.pct(acc.rate) : '—' });
    var tag = h('span', { class: 'tag' + (acc.manual ? ' tag-manual' : ''), text: acc.manual ? '手改' : '自动' });

    var ent = D.entryOf(rev.weekIndex, module) || {};

    var totalIn = h('input', {
      class: 'input num', type: 'number', inputmode: 'numeric', min: '0',
      placeholder: auto.total > 0 ? String(auto.total) : '题数'
    });
    if (ent.totalOverride !== null && ent.totalOverride !== undefined) {
      totalIn.value = String(ent.totalOverride);
    }

    var correctIn = h('input', {
      class: 'input num', type: 'number', inputmode: 'numeric', min: '0',
      placeholder: '正确数'
    });
    if (ent.correctOverride !== null && ent.correctOverride !== undefined) {
      correctIn.value = String(ent.correctOverride);
    }

    totalIn.addEventListener('input', function () {
      setOverride(rev.weekIndex, module, 'totalOverride', totalIn.value);
      tag.textContent = (totalIn.value !== '' || correctIn.value !== '') ? '手改' : '自动';
      tag.classList.toggle('tag-manual', tag.textContent === '手改');
      var a = D.moduleAccuracy(rev.weekIndex, module);
      rateEl.textContent = a.total > 0 ? D.pct(a.rate) : '—';
    });
    correctIn.addEventListener('input', function () {
      setOverride(rev.weekIndex, module, 'correctOverride', correctIn.value);
      tag.textContent = (totalIn.value !== '' || correctIn.value !== '') ? '手改' : '自动';
      tag.classList.toggle('tag-manual', tag.textContent === '手改');
      var a = D.moduleAccuracy(rev.weekIndex, module);
      rateEl.textContent = a.total > 0 ? D.pct(a.rate) : '—';
    });

    var errSel = h('select', { class: 'input' });
    errSel.appendChild(h('option', { value: '', text: '（未选）' }));
    CET4.TAX.errorTypes.forEach(function (e) {
      errSel.appendChild(h('option', { value: e, text: e }));
    });
    errSel.value = entryOf(rev.weekIndex, module).errorType || '';
    errSel.addEventListener('change', function () {
      setEntry(rev.weekIndex, module, 'errorType', errSel.value);
    });

    var wrongIn = h('input', { class: 'input', type: 'text', placeholder: '如 3、7、12' });
    wrongIn.value = entryOf(rev.weekIndex, module).wrongNos || '';
    wrongIn.addEventListener('input', function () {
      setEntry(rev.weekIndex, module, 'wrongNos', wrongIn.value);
    });

    var nextIn = h('input', { class: 'input', type: 'text', maxlength: '80', placeholder: '下一套卷只做 1 个改变' });
    nextIn.value = entryOf(rev.weekIndex, module).nextAction || '';
    nextIn.addEventListener('input', function () {
      setEntry(rev.weekIndex, module, 'nextAction', nextIn.value);
    });

    return h('div', { class: 'rv-mod', style: { '--mc': CET4.TAX.colors[module] } },
      h('div', { class: 'row between' },
        h('b', { class: 'rv-name', text: module }), tag
      ),
      h('div', { class: 'grid3' },
        h('div', { class: 'field' }, h('label', { class: 'label', text: '总题数' }), totalIn),
        h('div', { class: 'field' }, h('label', { class: 'label', text: '正确数' }), correctIn),
        h('div', { class: 'field' }, h('label', { class: 'label', text: '正确率' }),
          h('div', { class: 'rate-box' }, rateEl))
      ),
      h('div', { class: 'field' }, h('label', { class: 'label', text: '错题编号' }), wrongIn),
      h('div', { class: 'field' }, h('label', { class: 'label', text: '错因分类' }), errSel),
      h('div', { class: 'field' }, h('label', { class: 'label', text: '下一套题的 1 个调整动作' }), nextIn)
    );
  }

  function isNum(v) { return typeof v === 'number' && !isNaN(v); }

  function entryOf(weekIdx, module) {
    var rev = D.reviewOf(weekIdx);
    for (var i = 0; i < rev.entries.length; i++) if (rev.entries[i].module === module) return rev.entries[i];
    return { errorType: '', wrongNos: '', nextAction: '' };
  }

  function setOverride(weekIdx, module, field, raw) {
    var v = raw === '' ? null : Math.max(0, Math.round(+raw));
    if (raw !== '' && isNaN(v)) v = null;
    CET4.Store.update(function (s) {
      var rev = byWeek(s, weekIdx);
      var e = byModule(rev, module);
      e[field] = v;
    });
  }

  function setEntry(weekIdx, module, field, val) {
    CET4.Store.update(function (s) {
      var rev = byWeek(s, weekIdx);
      var e = byModule(rev, module);
      e[field] = val;
    });
  }

  function labeledInput(weekIdx, field, label, max) {
    var val = '';
    var rev = D.reviewOf(weekIdx);
    if (rev) val = rev[field] || '';
    var counter = h('span', { class: 'counter', text: val.length + '/' + max });
    var inp = h('input', { class: 'input', type: 'text', maxlength: max });
    inp.value = val;
    inp.addEventListener('input', function () {
      counter.textContent = inp.value.length + '/' + max;
      CET4.Store.update(function (s) {
        byWeek(s, weekIdx)[field] = inp.value;
      });
    });
    return h('div', { class: 'field' },
      h('label', { class: 'label' }, label, counter), inp);
  }

  function byWeek(s, weekIdx) {
    for (var i = 0; i < s.reviews.length; i++) if (s.reviews[i].weekIndex === weekIdx) return s.reviews[i];
    return s.reviews[0];
  }
  function byModule(rev, module) {
    for (var i = 0; i < rev.entries.length; i++) if (rev.entries[i].module === module) return rev.entries[i];
    return rev.entries[0];
  }

  /* ==================== 设置 ==================== */
  function settingsView() {
    var S = CET4.Store.get();
    var wrap = h('div');

    wrap.appendChild(h('h2', { class: 'sec-h' }, '外观'));
    var themes = h('div', { class: 'seg small' },
      themeBtn('深色', 'dark'), themeBtn('浅色', 'light'));
    wrap.appendChild(h('section', { class: 'card' }, themes));

    wrap.appendChild(h('h2', { class: 'sec-h' }, '目标'));
    var goalIn = h('input', { class: 'input num', type: 'number', inputmode: 'numeric', min: '0', max: '710' });
    goalIn.value = S.settings.targetScore || 425;
    goalIn.addEventListener('input', function () {
      var v = goalIn.value === '' ? 425 : Math.max(0, Math.round(+goalIn.value));
      CET4.Store.update(function (s) { s.settings.targetScore = v; });
    });
    wrap.appendChild(h('section', { class: 'card' },
      h('div', { class: 'field' }, h('label', { class: 'label', text: '目标分' }), goalIn),
      h('div', { class: 'row between' },
        h('span', { class: 'muted', text: '考试日' }),
        h('span', { text: U.fmtClock(CET4.TAX.exam.date, CET4.TAX.exam.time) })
      ),
      h('div', { class: 'muted small', text: '48 天计划按 2026-12-12 生成，考试日不可改。' })
    ));

    wrap.appendChild(h('h2', { class: 'sec-h' }, '存储'));
    var size = 0;
    try { size = JSON.stringify(S).length; } catch (e) { size = 0; }
    var memos = S.memos || [];
    wrap.appendChild(h('section', { class: 'card' },
      row('存储位置', '本机浏览器 localStorage'),
      row('占用空间', (size / 1024).toFixed(1) + ' KB'),
      row('自动保存', CET4.Store.isFailed() ? '失败（存储不可用）' : '每次修改后 300ms'),
      row('最后保存', U.fmtStamp(S.savedAt)),
      row('上次导出备份', U.fmtStamp(S.settings.lastExportAt)),
      CET4.Store.isFailed()
        ? h('div', { class: 'banner-warn', text: '当前浏览器禁止本地存储（可能是无痕模式），数据不会保存。' })
        : null
    ));

    wrap.appendChild(h('h2', { class: 'sec-h' }, '备份'));
    wrap.appendChild(h('section', { class: 'card' },
      h('p', { class: 'muted small', text: '换手机 / 换浏览器 / 清缓存前，先导出 JSON；到新设备再导入。' }),
      h('div', { class: 'row gap wrap' },
        h('button', { class: 'btn btn-primary', text: '导出备份', onclick: CET4.A.exportNow }),
        h('button', { class: 'btn btn-ghost', text: '导入备份', onclick: CET4.A.importPick }),
        h('button', {
          class: 'btn btn-ghost', text: '恢复上一份',
          onclick: function () {
            U.ask({ title: '恢复上一份备份？', body: '会用上一份自动保存的内容替换当前数据。', okText: '恢复' })
              .then(function (yes) {
                if (!yes) return;
                var r = CET4.Store.restorePrev();
                if (r.ok) { U.toast('已恢复上一份备份', 'ok'); CET4.App.fullRefresh(); }
                else U.toast(r.error, 'bad');
              });
          }
        })
      )
    ));

    wrap.appendChild(h('h2', { class: 'sec-h' }, '备忘（共 ' + memos.length + ' 条）'));
    var memoCard = h('section', { class: 'card' });
    if (!memos.length) memoCard.appendChild(h('div', { class: 'empty-line', text: '没有备忘' }));
    memos.forEach(function (m) {
      memoCard.appendChild(h('div', { class: 'row between memo-row' },
        h('span', { class: m.done ? 'memo-txt done-txt' : 'memo-txt', text: m.text }),
        h('button', {
          class: 'icon-btn', text: '×',
          onclick: function () { CET4.A.delMemo(m.id); }
        })
      ));
    });
    wrap.appendChild(memoCard);

    wrap.appendChild(h('h2', { class: 'sec-h' }, '危险操作'));
    wrap.appendChild(h('section', { class: 'card danger-card' },
      h('p', { class: 'muted small', text: '清空会删除全部打卡、记录、复盘与备忘，且不可撤销。建议先导出备份。' }),
      h('button', {
        class: 'btn btn-danger', text: '清空所有数据',
        onclick: function () {
          U.ask({
            title: '清空所有数据？',
            body: '此操作不可撤销。请输入「清空」确认。',
            requireText: '清空', okText: '清空', danger: true
          }).then(function (yes) {
            if (!yes) return;
            CET4.Store.reset();
            U.toast('已清空，回到初始数据', 'ok');
            CET4.App.fullRefresh();
          });
        }
      })
    ));

    wrap.appendChild(h('p', { class: 'muted center small', text: 'CET-4 备考台 v1.0 · 纯本地网页 · 无账号无联网' }));

    return wrap;

    function themeBtn(label, val) {
      return h('button', {
        type: 'button',
        class: 'seg-item' + (S.settings.theme === val ? ' active' : ''),
        text: label,
        onclick: function (e) {
          e.preventDefault();
          CET4.Store.update(function (s) { s.settings.theme = val; });
          CET4.App.applyTheme();
          CET4.App.refresh();
        }
      });
    }
    function row(k, v) {
      return h('div', { class: 'row between' },
        h('span', { class: 'muted', text: k }), h('span', { text: v }));
    }
  }
};

</script>
<script>
/* src/app.js */
/* CET-4 备考台 · 启动与渲染调度 */
window.CET4 = window.CET4 || {};

CET4.App = (function () {
  var started = false;
  var lastKey = null;

  function applyTheme() {
    var s = CET4.Store.get();
    var t = (s && s.settings && s.settings.theme) || 'dark';
    document.documentElement.setAttribute('data-theme', t);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', t === 'light' ? '#f5f7fb' : '#0f1218');
  }

  function markTab(route) {
    var group = route.page === 'm' ? 'data' : route.page;
    var links = document.querySelectorAll('#tabs a');
    for (var i = 0; i < links.length; i++) {
      var on = links[i].getAttribute('data-tab') === group;
      links[i].classList.toggle('active', on);
      if (on) links[i].setAttribute('aria-current', 'page');
      else links[i].removeAttribute('aria-current');
    }
  }

  function errorBox(e) {
    var box = document.createElement('div');
    box.className = 'card empty';
    var p1 = document.createElement('p');
    p1.textContent = '这一页渲染出错了：' + (e && e.message ? e.message : String(e));
    var p2 = document.createElement('p');
    p2.className = 'muted small';
    p2.textContent = '可以先点下面的按钮回到首页。数据已经保存在本机，不会丢。';
    var a = document.createElement('a');
    a.className = 'btn btn-ghost';
    a.href = '#/home';
    a.textContent = '回首页';
    box.appendChild(p1);
    box.appendChild(p2);
    box.appendChild(a);
    return box;
  }

  function refresh() {
    if (!started) return;
    var route = CET4.Router.parse();
    var main = document.getElementById('view');
    var state = CET4.Store.get();
    CET4.D.setState(state);
    applyTheme();

    try {
      if (route.page === 'm') CET4.Views.modules(main, route.arg);
      else if (route.page === 'today') CET4.Views.today(main, route.arg);
      else if (route.page === 'data') CET4.Views.data(main, route.arg);
      else CET4.Views.home(main);
    } catch (e) {
      if (window.console && console.error) console.error(e);
      main.textContent = '';
      main.appendChild(errorBox(e));
    }

    markTab(route);

    var names = { home: '首页', today: '今日计划', data: '数据与设置', m: '模块记录' };
    document.title = (names[route.page] || '首页') + ' · CET-4 备考台';

    var key = route.page + '/' + (route.arg || '');
    if (key !== lastKey) {
      lastKey = key;
      window.scrollTo(0, 0);
    }
  }

  function fullRefresh() {
    applyTheme();
    refresh();
    if (CET4.Store.isCorrupt()) {
      CET4.UI.toast('本地数据损坏，已使用初始数据', 'warn');
    }
  }

  function boot() {
    if (started) return;
    CET4.Store.init();
    CET4.D.setState(CET4.Store.get());
    applyTheme();
    started = true;
    CET4.Router.start(refresh);

    document.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) {
        e.preventDefault();
        var ok = CET4.Store.flush();
        CET4.UI.toast(ok ? '已保存到本机浏览器' : '保存失败：存储不可用', ok ? 'ok' : 'bad');
      }
    });

    if (!CET4.Store.available()) {
      CET4.UI.toast('浏览器禁止本地存储，数据不会被保存', 'bad');
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

  return { refresh: refresh, fullRefresh: fullRefresh, applyTheme: applyTheme, boot: boot };
})();

</script>
</body>
</html>
